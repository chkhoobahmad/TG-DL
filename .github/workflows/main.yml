name: ⬇️ Download Telegram Posts

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (با فاصله جدا کنید)'
        required: true
        type: string
        placeholder: 'https://t.me/username/123 https://t.me/username/456'
      mode:
        description: '📦 حالت دانلود'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      password:
        description: '🔒 رمز عبور برای فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  save-file:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup

          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /

          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          lfs: false

      - name: Remove Git LFS tracking
        run: |
          git lfs uninstall 2>/dev/null || true
          rm -f .gitattributes
          git config --local --unset-all filter.lfs.process 2>/dev/null || true
          git config --local --unset-all filter.lfs.smudge 2>/dev/null || true
          git config --local --unset-all filter.lfs.clean 2>/dev/null || true
          git config --global filter.lfs.smudge ""
          git config --global filter.lfs.clean ""
          echo "✅ Git LFS disabled"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3 aria2

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Git configured"

      - name: Download from Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          if [ ! -f "download_telegram.js" ]; then
            echo "❌ download_telegram.js not found in repository!"
            exit 1
          fi

          sudo rm -rf /tmp/telegram_downloads
          mkdir -p /tmp/telegram_downloads

          export POST_URLS="${{ github.event.inputs.post_urls }}"
          node download_telegram.js

          if [ $? -eq 0 ] && [ -f "/tmp/all_post_dirs.txt" ] && [ -s "/tmp/all_post_dirs.txt" ]; then
            echo "✅ All downloads completed!"
            cat /tmp/all_post_dirs.txt
          else
            echo "❌ Download failed!"
            exit 1
          fi

      - name: Process and create split ZIP archives
        run: |
          SPLIT_THRESHOLD_MB=45
          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          mkdir -p downloads tmp_downloads

          echo "=== Contents of /tmp/all_post_dirs.txt ==="
          cat /tmp/all_post_dirs.txt
          echo "==========================================="

          # Copy files from Telegram downloads
          while IFS= read -r POST_DIR; do
            POST_DIR=$(echo "$POST_DIR" | xargs)
            if [ -z "$POST_DIR" ] || [ ! -d "$POST_DIR" ]; then
              echo "⚠️ Directory not found: $POST_DIR"
              continue
            fi

            echo "Processing directory: $POST_DIR"
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ]; then
                FILENAME=$(basename "$FILE")
                # Skip metadata files
                if [[ "$FILENAME" != *".json" ]] && [[ "$FILENAME" != *"info"* ]] && [[ "$FILENAME" != *"message"* ]] && [[ "$FILENAME" != *"no_media"* ]]; then
                  if [ -s "$FILE" ]; then
                    cp "$FILE" "tmp_downloads/$FILENAME"
                    echo "  ✅ Copied: $FILENAME"
                  fi
                fi
              fi
            done
          done < /tmp/all_post_dirs.txt

          # Check if we have files to process
          if [ ! -d "tmp_downloads" ] || [ -z "$(ls -A tmp_downloads 2>/dev/null)" ]; then
            echo "❌ No files were copied to tmp_downloads!"
            exit 1
          fi

          echo "=== Files to process ==="
          ls -la tmp_downloads/

          # Process each file
          for FILE in tmp_downloads/*; do
            [ -f "$FILE" ] || continue

            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            BASENAME_NO_EXT="${BASENAME%.*}"
            FOLDER_NAME="$BASENAME_NO_EXT"
            TARGET_DIR="$BACKUP_DIR/$FOLDER_NAME"
            mkdir -p "$TARGET_DIR"

            echo ""
            echo "Processing: $BASENAME ($(( SIZE / 1024 / 1024 ))MB)"

            if [ "$SIZE" -gt $(( SPLIT_THRESHOLD_MB * 1024 * 1024 )) ]; then
              # Split into parts
              cd "$TARGET_DIR"
              zip -s ${SPLIT_THRESHOLD_MB}m "${FOLDER_NAME}.zip" "$FILE" > /dev/null 2>&1
              cd - > /dev/null
              rm -f "$FILE"

              PARTS_COUNT=$(ls -1 "$TARGET_DIR"/*.zip "$TARGET_DIR"/*.z[0-9]* 2>/dev/null | wc -l)
              TOTAL_SIZE=0
              for PART in "$TARGET_DIR"/*; do
                [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART" 2>/dev/null || echo 0)))
              done
              TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)

              cat > "$TARGET_DIR/README.md" <<-EOF
                # 📥 ${FOLDER_NAME}

                **Size:** ${TOTAL_SIZE_MB} MB
                **Parts:** ${PARTS_COUNT}

                ## Download
                Download all parts (.z01, .z02, ..., .zip) and extract the .zip file.

                *Created by [avasam.ir](https://avasam.ir)*
              EOF
              echo "  ✅ Created ${PARTS_COUNT} parts (${TOTAL_SIZE_MB}MB)"
            else
              # Single zip
              cd "$TARGET_DIR"
              zip "${FOLDER_NAME}.zip" "$FILE" > /dev/null 2>&1
              cd - > /dev/null
              rm -f "$FILE"

              SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
              cat > "$TARGET_DIR/README.md" <<-EOF
                # 📥 ${FOLDER_NAME}

                **Size:** ${SIZE_MB} MB

                ## Download
                Download ${FOLDER_NAME}.zip and extract.

                *Created by [avasam.ir](https://avasam.ir)*
              EOF
              echo "  ✅ Created zip (${SIZE_MB}MB)"
            fi
          done

          rm -rf tmp_downloads
          echo ""
          echo "=== Backup folder contents ==="
          ls -la "$BACKUP_DIR/"

      - name: Copy to downloads and update README
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)

          rm -rf downloads
          mkdir -p downloads

          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            for FOLDER in "$BACKUP_DIR"/*; do
              if [ -d "$FOLDER" ]; then
                FOLDER_NAME=$(basename "$FOLDER")
                cp -r "$FOLDER" "downloads/$FOLDER_NAME"
                echo "✅ Copied: $FOLDER_NAME"
              fi
            done
          fi

          echo ""
          echo "=== Final downloads structure ==="
          ls -la downloads/
          for DIR in downloads/*/; do
            echo "Contents of $(basename "$DIR"):"
            ls -la "$DIR"
          done

          # Create root README
          cat > README.md <<-EOF
            # 📥 Telegram Downloader

            دانلود خودکار پست‌های تلگرام

            ## 📁 Downloads

          EOF

          for FOLDER in downloads/*/; do
            if [ -d "$FOLDER" ]; then
              FOLDER_NAME=$(basename "$FOLDER")
              SIZE=$(du -sh "$FOLDER" 2>/dev/null | cut -f1)
              echo "- **${FOLDER_NAME}** (${SIZE}) - [View](./downloads/${FOLDER_NAME}/)" >> README.md
            fi
          done

          cat >> README.md <<-EOF

            ---
            *Created by [avasam.ir](https://avasam.ir)*
          EOF

          echo "✅ README files created"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi

          git add -f downloads/
          git add README.md

          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"

            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi

          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "📁 Files are stored in the 'downloads' folder"
          echo "=========================================="
