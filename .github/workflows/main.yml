name: ⬇️ Download from Telegram Post

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: '🔗 لینک پست تلگرام (مثال: https://t.me/username/123)'
        required: true
        type: string

jobs:
  download-from-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          
          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 50m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Download from Telegram
        id: download
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          POST_URL: ${{ github.event.inputs.post_url }}
        run: |
          cat > download_telegram.js << 'EOF'
          const { TelegramClient } = require("telegram");
          const { StringSession } = require("telegram/sessions");
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const apiId = parseInt(process.env.API_ID);
          const apiHash = process.env.API_HASH;
          const stringSession = process.env.STRING_SESSION;
          const postUrl = process.env.POST_URL;

          let lastLoggedPercent = 0;

          function sanitizeFilename(filename) {
            return filename.replace(/[<>:"|?*\\/]/g, '_').replace(/\s+/g, '_');
          }

          async function extractChatAndMsgId(url) {
            const patterns = [
              /https?:\/\/t\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
              /https?:\/\/telegram\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
            ];
            
            let match = null;
            for (const pattern of patterns) {
              match = url.match(pattern);
              if (match) break;
            }
            
            if (!match) {
              throw new Error('Invalid Telegram post URL format');
            }
            
            let chatId = match[1];
            const msgId = parseInt(match[2]);
            
            if (chatId === 'c' || chatId.startsWith('c/')) {
              chatId = '-100' + chatId.replace('c/', '').replace('c', '');
            } else if (!isNaN(parseInt(chatId)) && chatId.length > 5) {
              chatId = '-100' + chatId;
            }
            
            return { chatId, msgId };
          }

          async function downloadMediaFile(client, media, outputPath, fileName) {
            return new Promise(async (resolve, reject) => {
              try {
                const filePath = await client.downloadMedia(media, {
                  outputFile: outputPath,
                  progressCallback: (downloaded, total) => {
                    const percent = (downloaded / total * 100);
                    if (Math.floor(percent / 10) > Math.floor(lastLoggedPercent / 10)) {
                      lastLoggedPercent = percent;
                      const downloadedMB = downloaded / 1024 / 1024;
                      const totalMB = total / 1024 / 1024;
                      console.log(`      📊 ${percent.toFixed(1)}% (${downloadedMB.toFixed(2)}MB / ${totalMB.toFixed(2)}MB)`);
                    }
                  }
                });
                
                if (filePath && fs.existsSync(filePath)) {
                  const stats = fs.statSync(filePath);
                  if (stats.size > 0) {
                    console.log(`   ✅ Downloaded: ${fileName} (${(stats.size/1024/1024).toFixed(2)}MB)`);
                    resolve(filePath);
                  } else {
                    reject(new Error("File is empty"));
                  }
                } else {
                  reject(new Error("Download failed"));
                }
              } catch (err) {
                reject(err);
              }
            });
          }

          async function getFileNameFromMedia(media) {
            // Try to get filename from document attributes
            if (media.document && media.document.attributes) {
              for (const attr of media.document.attributes) {
                if (attr.className === 'DocumentAttributeFilename') {
                  return sanitizeFilename(attr.fileName);
                }
              }
            }
            
            return null;
          }

          async function main() {
            let client = null;
            let postDir = null;
            
            try {
              console.log('🚀 Connecting to Telegram...');
              
              const session = new StringSession(stringSession);
              client = new TelegramClient(session, apiId, apiHash, {
                connectionRetries: 5,
                useWSS: true,
              });
              
              await client.start({
                phoneNumber: () => Promise.reject(new Error('Use STRING_SESSION')),
                phoneCode: () => Promise.reject(new Error('Use STRING_SESSION')),
                password: () => Promise.reject(new Error('Use STRING_SESSION')),
                onError: (err) => console.error('Connection error:', err),
              });
              
              console.log('✅ Connected successfully!');
              
              const { chatId, msgId } = await extractChatAndMsgId(postUrl);
              console.log(`📨 Fetching message from chat: ${chatId}, message ID: ${msgId}`);
              
              // Get chat entity to get channel name
              let chat;
              if (chatId.toString().startsWith('-100')) {
                chat = await client.getEntity(parseInt(chatId));
              } else {
                chat = await client.getEntity(chatId);
              }
              
              // Get channel name (username or title)
              let channelName = "unknown_channel";
              if (chat.username) {
                channelName = chat.username;
              } else if (chat.title) {
                channelName = sanitizeFilename(chat.title);
              } else {
                channelName = chatId.toString().replace('-100', '');
              }
              
              // Get the target message
              const messages = await client.getMessages(chat, { ids: msgId });
              const message = messages[0];
              
              if (!message) {
                throw new Error('Message not found');
              }
              
              console.log('✅ Message found!');
              
              // Create directory structure: /tmp/channel_name/post_id/
              const baseTempDir = `/tmp/telegram_downloads`;
              const channelDir = path.join(baseTempDir, channelName);
              postDir = path.join(channelDir, String(msgId));
              fs.mkdirSync(postDir, { recursive: true });
              
              console.log(`\n📁 Channel: ${channelName}`);
              console.log(`📁 Post ID: ${msgId}`);
              console.log(`📁 Save directory: ${postDir}\n`);
              
              const downloadedFiles = [];
              
              // Save message text
              if (message.text && message.text.length > 0) {
                const textFile = path.join(postDir, 'message_text.txt');
                fs.writeFileSync(textFile, message.text);
                downloadedFiles.push(textFile);
                console.log(`📝 Saved message text (${message.text.length} characters)`);
              }
              
              // Download media if exists
              if (message.media) {
                console.log(`📥 Downloading media...`);
                lastLoggedPercent = 0;
                
                let fileName = await getFileNameFromMedia(message.media);
                
                if (!fileName) {
                  // Detect from media type
                  const mediaType = message.media.className;
                  if (mediaType === 'MessageMediaPhoto') {
                    fileName = `photo.jpg`;
                  } else if (mediaType === 'MessageMediaDocument') {
                    fileName = `document`;
                  } else {
                    fileName = `media`;
                  }
                }
                
                let outputPath = path.join(postDir, fileName);
                
                // Download to temp first to detect correct extension if needed
                if (!path.extname(outputPath) || path.extname(outputPath) === '') {
                  const tempPath = path.join(postDir, `temp_download`);
                  try {
                    await downloadMediaFile(client, message.media, tempPath, fileName);
                    
                    if (fs.existsSync(tempPath)) {
                      const fileType = execSync(`file --mime-type -b "${tempPath}"`).toString().trim();
                      const extMap = {
                        'video/mp4': '.mp4', 'video/x-matroska': '.mkv', 'video/webm': '.webm',
                        'video/quicktime': '.mov', 'video/x-msvideo': '.avi',
                        'audio/mpeg': '.mp3', 'audio/mp4': '.m4a', 'audio/ogg': '.ogg',
                        'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif',
                        'application/pdf': '.pdf', 'application/zip': '.zip',
                        'application/x-rar': '.rar', 'application/x-7z-compressed': '.7z'
                      };
                      const ext = extMap[fileType] || '';
                      const finalPath = outputPath + ext;
                      fs.renameSync(tempPath, finalPath);
                      downloadedFiles.push(finalPath);
                      console.log(`   ✅ Saved as: ${path.basename(finalPath)}`);
                    }
                  } catch (err) {
                    console.error(`   ❌ Error downloading: ${err.message}`);
                  }
                } else {
                  try {
                    await downloadMediaFile(client, message.media, outputPath, fileName);
                    downloadedFiles.push(outputPath);
                  } catch (err) {
                    console.error(`   ❌ Error downloading: ${err.message}`);
                  }
                }
              } else {
                console.log(`⚠️ No media found in this post`);
                // Save post info even if no media
                const infoFile = path.join(postDir, 'post_info.json');
                fs.writeFileSync(infoFile, JSON.stringify({
                  url: postUrl,
                  channel: channelName,
                  channelId: chatId,
                  postId: msgId,
                  postDate: message.date,
                  hasMedia: false,
                  hasText: !!(message.text && message.text.length > 0)
                }, null, 2));
                downloadedFiles.push(infoFile);
              }
              
              // Save post info
              const infoFile = path.join(postDir, 'post_info.json');
              const totalSizeMB = downloadedFiles.reduce((sum, f) => {
                try {
                  return sum + fs.statSync(f).size;
                } catch {
                  return sum;
                }
              }, 0) / 1024 / 1024;
              
              fs.writeFileSync(infoFile, JSON.stringify({
                url: postUrl,
                channel: channelName,
                channelId: chatId,
                postId: msgId,
                postDate: message.date,
                totalFiles: downloadedFiles.length,
                totalSizeMB: totalSizeMB.toFixed(2),
                hasMedia: !!message.media,
                hasText: !!(message.text && message.text.length > 0)
              }, null, 2));
              
              if (!downloadedFiles.includes(infoFile)) {
                downloadedFiles.push(infoFile);
              }
              
              // Save list of all files
              const filesList = '/tmp/downloaded_files.txt';
              fs.writeFileSync(filesList, downloadedFiles.join('\n'));
              
              console.log(`\n📊 Summary:`);
              console.log(`   - Channel: ${channelName}`);
              console.log(`   - Post ID: ${msgId}`);
              console.log(`   - Total files: ${downloadedFiles.length}`);
              console.log(`   - Total size: ${totalSizeMB.toFixed(2)}MB`);
              console.log(`   - Save directory: ${postDir}`);
              
              // Write output for next steps
              const outputFile = process.env.GITHUB_OUTPUT;
              if (outputFile) {
                fs.appendFileSync(outputFile, `BASE_DIR=${postDir}\n`);
                fs.appendFileSync(outputFile, `CHANNEL_NAME=${channelName}\n`);
                fs.appendFileSync(outputFile, `POST_ID=${msgId}\n`);
              }
              
              // Also write to a file as fallback
              fs.writeFileSync('/tmp/base_dir.txt', postDir);
              
            } catch (error) {
              console.error('❌ Fatal error:', error);
              process.exit(1);
            } finally {
              if (client) {
                try {
                  console.log('👋 Disconnecting from Telegram...');
                  await client.disconnect();
                  console.log('✅ Disconnected successfully');
                } catch (err) {
                  console.log('⚠️ Disconnect warning:', err.message);
                }
              }
            }
          }
          
          // Ignore timeout errors after successful download
          process.on('unhandledRejection', (err) => {
            if (err.message && err.message.includes('TIMEOUT')) {
              console.log('⚠️ Ignoring timeout error (download completed successfully)');
              process.exit(0);
            } else {
              console.error('Unhandled rejection:', err);
              process.exit(1);
            }
          });
          
          main().catch(err => {
            console.error('Main error:', err);
            process.exit(1);
          });
          EOF

          # Run the download script
          node download_telegram.js
          
          # Ensure exit code is 0 even if timeout error occurred but download succeeded
          DOWNLOAD_EXIT=$?
          if [ $DOWNLOAD_EXIT -eq 0 ] || ([ -f "/tmp/downloaded_files.txt" ] && [ -s "/tmp/downloaded_files.txt" ]); then
            echo "Download completed successfully (exit code: $DOWNLOAD_EXIT)"
            exit 0
          else
            exit $DOWNLOAD_EXIT
          fi

      - name: Get base directory
        id: get_dir
        run: |
          if [ -f "/tmp/base_dir.txt" ]; then
            BASE_DIR=$(cat /tmp/base_dir.txt)
          else
            BASE_DIR=$(ls -td /tmp/telegram_downloads/*/* 2>/dev/null | head -1)
          fi
          echo "BASE_DIR=${BASE_DIR}" >> $GITHUB_OUTPUT
          echo "Base directory: ${BASE_DIR}"
          
          # Debug: show what files exist
          echo ""
          echo "📁 Files in download directory:"
          if [ -d "${BASE_DIR}" ]; then
            find "${BASE_DIR}" -type f 2>/dev/null | while read file; do
              SIZE=$(stat -c%s "$file" 2>/dev/null | awk '{printf "%.2fMB", $1/1024/1024}' || echo "unknown")
              echo "   - $(basename "$file") (${SIZE})"
            done
          else
            echo "   Directory not found: ${BASE_DIR}"
          fi
          echo ""
          echo "📄 Downloaded files list:"
          cat /tmp/downloaded_files.txt 2>/dev/null || echo "No files list found"

      - name: Create ZIP archive
        run: |
          BASE_DIR="${{ steps.get_dir.outputs.BASE_DIR }}"
          
          if [ -z "$BASE_DIR" ] || [ ! -d "$BASE_DIR" ]; then
            echo "❌ No downloads found at: $BASE_DIR"
            exit 1
          fi

          BACKUP_DIR="/tmp/backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          SPLIT_SIZE_MB=45

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          # Get channel name and post ID from path
          CHANNEL_NAME=$(basename $(dirname "$BASE_DIR"))
          POST_ID=$(basename "$BASE_DIR")
          FOLDER_NAME="${CHANNEL_NAME}_${POST_ID}"
          
          mkdir -p "$BACKUP_DIR/$FOLDER_NAME"

          echo "📦 Creating archive in folder: $BACKUP_DIR/$FOLDER_NAME"
          echo "📁 Channel: $CHANNEL_NAME"
          echo "📁 Post: $POST_ID"

          # Find all files to archive
          VALID_FILES=()
          
          # Read from downloaded_files.txt if exists
          if [ -f "/tmp/downloaded_files.txt" ] && [ -s "/tmp/downloaded_files.txt" ]; then
            while IFS= read -r FILE; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                VALID_FILES+=("$FILE")
                SIZE_MB=$(stat -c%s "$FILE" | awk '{printf "%.2fMB", $1/1024/1024}')
                echo "   ✅ Added: $(basename "$FILE") (${SIZE_MB})"
              fi
            done < /tmp/downloaded_files.txt
          fi
          
          # Also find any files directly in BASE_DIR
          if [ -d "$BASE_DIR" ]; then
            for FILE in "$BASE_DIR"/*; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                # Check if already added
                FOUND=0
                for ADDED in "${VALID_FILES[@]}"; do
                  if [ "$ADDED" = "$FILE" ]; then
                    FOUND=1
                    break
                  fi
                done
                if [ $FOUND -eq 0 ]; then
                  VALID_FILES+=("$FILE")
                  SIZE_MB=$(stat -c%s "$FILE" | awk '{printf "%.2fMB", $1/1024/1024}')
                  echo "   ✅ Added: $(basename "$FILE") (${SIZE_MB})"
                fi
              fi
            done
          fi

          if [ ${#VALID_FILES[@]} -eq 0 ]; then
            echo "❌ No valid files to archive!"
            echo "Searching in: $BASE_DIR"
            ls -la "$BASE_DIR" 2>/dev/null || echo "Directory empty or not found"
            exit 1
          fi

          TEMP_ZIP_DIR="$BACKUP_DIR/$FOLDER_NAME/temp_files"
          mkdir -p "$TEMP_ZIP_DIR"

          for FILE in "${VALID_FILES[@]}"; do
            ORIGINAL_NAME=$(basename "$FILE")
            SAFE_NAME=$(echo "$ORIGINAL_NAME" | sed 's/[<>:"|?*]/_/g')
            cp "$FILE" "$TEMP_ZIP_DIR/$SAFE_NAME"
          done

          ARCHIVE_NAME="${POST_ID}"
          ARCHIVE_PATH="$BACKUP_DIR/$FOLDER_NAME/${ARCHIVE_NAME}.zip"
          
          cd "$TEMP_ZIP_DIR"
          
          # Check total size to decide if splitting is needed
          TOTAL_SIZE=0
          for FILE in *; do
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              TOTAL_SIZE=$((TOTAL_SIZE + SIZE))
            fi
          done
          TOTAL_SIZE_MB=$((TOTAL_SIZE / 1024 / 1024))
          
          if [ $TOTAL_SIZE_MB -gt 45 ]; then
            echo "📀 Total size ${TOTAL_SIZE_MB}MB > 45MB - Creating split archive (${SPLIT_SIZE_MB}MB per part)..."
            zip -r -0 -s ${SPLIT_SIZE_MB}m "${ARCHIVE_PATH}" ./* 2>/dev/null
          else
            echo "📀 Total size ${TOTAL_SIZE_MB}MB <= 45MB - Creating single archive..."
            zip -r -0 "${ARCHIVE_PATH}" ./* 2>/dev/null
          fi
          
          cd - > /dev/null
          rm -rf "$TEMP_ZIP_DIR"

          FOLDER_ENCODED=$(urlencode "${FOLDER_NAME}")
          DOWNLOAD_LINKS_MD=""
          LINK_NUM=0
          TOTAL_ARCHIVE_SIZE=0
          
          echo ""
          echo "📋 Archive parts:"
          for part_file in $(ls "$BACKUP_DIR/$FOLDER_NAME/"*.zip "$BACKUP_DIR/$FOLDER_NAME/"*.z[0-9]* 2>/dev/null | sort); do
            [ -f "$part_file" ] || continue
            PART_BASENAME=$(basename "$part_file")
            PART_SIZE=$(stat -c%s "$part_file" 2>/dev/null || echo 0)
            PART_SIZE_MB=$(echo "scale=2; $PART_SIZE / 1024 / 1024" | bc)
            TOTAL_ARCHIVE_SIZE=$((TOTAL_ARCHIVE_SIZE + PART_SIZE))
            echo "   - ${PART_BASENAME} (${PART_SIZE_MB}MB)"
          done
          
          TOTAL_ARCHIVE_SIZE_MB=$(echo "scale=2; $TOTAL_ARCHIVE_SIZE / 1024 / 1024" | bc)
          POST_URL="${{ github.event.inputs.post_url }}"
          
          for part_file in $(ls "$BACKUP_DIR/$FOLDER_NAME/"*.zip "$BACKUP_DIR/$FOLDER_NAME/"*.z[0-9]* 2>/dev/null | sort); do
            [ -f "$part_file" ] || continue
            PART_BASENAME=$(basename "$part_file")
            PART_ENCODED=$(urlencode "${PART_BASENAME}")
            RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${FOLDER_ENCODED}/${PART_ENCODED}"
            LINK_NUM=$((LINK_NUM + 1))
            DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | [Download](${RAW_LINK}) |"$'\n'
          done

          {
            echo "# 📥 Telegram Post ${POST_ID}"
            echo ""
            echo "---"
            echo ""
            echo "## 📊 Download Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Channel** | \`${CHANNEL_NAME}\` |"
            echo "| **Post ID** | \`${POST_ID}\` |"
            echo "| **Source** | [${POST_URL}](${POST_URL}) |"
            echo "| **Total Files** | ${#VALID_FILES[@]} files |"
            echo "| **Archive Size** | ${TOTAL_ARCHIVE_SIZE_MB} MB (${LINK_NUM} parts) |"
            echo "| **Status** | ✅ **Complete** |"
            echo ""
            echo "---"
            echo ""
            echo "## 📁 Files in this post"
            echo ""
            for FILE in "${VALID_FILES[@]}"; do
              BASENAME=$(basename "$FILE")
              if [ "$BASENAME" != "post_info.json" ] && [ "$BASENAME" != "message_text.txt" ]; then
                SIZE=$(stat -c%s "$FILE" | awk '{printf "%.2fMB", $1/1024/1024}')
                echo "- \`${BASENAME}\` (${SIZE})"
              fi
            done
            if [ -f "$BASE_DIR/message_text.txt" ]; then
              echo "- \`message_text.txt\` (Text content)"
            fi
            if [ -f "$BASE_DIR/post_info.json" ]; then
              echo "- \`post_info.json\` (Metadata)"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 🔗 Download Links"
            echo ""
            echo "| # | File | Link |"
            echo "|---|------|------|"
            printf '%s' "${DOWNLOAD_LINKS_MD}"
            echo ""
            echo "---"
            echo ""
            echo "## 📖 How to Extract"
            echo ""
            echo "1. **Download all parts** (\`.zip\`, \`.z01\`, \`.z02\`...)"
            echo "2. **Open** \`${POST_ID}.zip\` with WinRAR or 7-Zip"
            echo "3. **Extract** — all parts combine automatically"
            echo ""
            echo "---"
            echo ""
            echo "*🛠️ Created by [avasam.ir](https://avasam.ir)*"
          } > "$BACKUP_DIR/$FOLDER_NAME/README.md"

          echo ""
          echo "✅ Archive created! Total parts: ${LINK_NUM}, Size: ${TOTAL_ARCHIVE_SIZE_MB}MB"

      - name: Update main README.md
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"

          mkdir -p downloads
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            cp -r "$BACKUP_DIR"/* downloads/
          fi

          FOLDERS=$(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)

          if [ -z "$FOLDERS" ]; then
            echo "No folders found in downloads"
            exit 0
          fi

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          {
            echo "# 📥 Downloads from Telegram"
            echo ""
            echo "---"
            echo ""
            echo "## 📁 Available Downloads"
            echo ""
            for FOLDER in $FOLDERS; do
              if [ -n "$FOLDER" ]; then
                FOLDER_ENCODED=$(urlencode "${FOLDER}")
                echo "- [${FOLDER}](./${FOLDER_ENCODED})"
              fi
            done
            echo ""
            echo "---"
            echo ""
            echo "*🛠️ Created by [avasam.ir](https://avasam.ir)*"
          } > "downloads/README.md"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)

          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)
          echo "Total files to push: $BACKUP_FILE_COUNT"

          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "Nothing to push"
            exit 0
          fi

          git fetch origin "$BRANCH" 2>/dev/null || true
          git reset --hard origin/"$BRANCH" 2>/dev/null || true

          mkdir -p downloads
          cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true

          git add -f downloads/
          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Download from Telegram post [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if timeout 300 git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retry $i/5..."
                if [ $i -lt 5 ]; then
                  sleep 10
                  git fetch origin "$BRANCH" 2>/dev/null || true
                  git reset --hard origin/"$BRANCH" 2>/dev/null || true
                  cp -r "$BACKUP_DIR"/* downloads/ 2>/dev/null || true
                  git add -f downloads/
                  git add README.md
                  if ! git diff --cached --quiet; then
                    git commit -m "Download from Telegram post [skip ci]"
                  fi
                fi
              fi
            done
          fi

          echo "✅ Done!"
