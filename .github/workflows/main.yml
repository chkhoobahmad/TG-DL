name: ⬇️ Download Telegram Posts

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (با فاصله جدا کنید)'
        required: true
        type: string
        placeholder: 'https://t.me/username/123 https://t.me/username/456'

jobs:
  save-file:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          lfs: false

      - name: Remove Git LFS tracking
        run: |
          git lfs uninstall 2>/dev/null || true
          rm -f .gitattributes
          git config --local --unset-all filter.lfs.process 2>/dev/null || true
          git config --local --unset-all filter.lfs.smudge 2>/dev/null || true
          git config --local --unset-all filter.lfs.clean 2>/dev/null || true
          git config --global filter.lfs.smudge ""
          git config --global filter.lfs.clean ""
          echo "✅ Git LFS disabled"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3 aria2

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Git configured"

      - name: Download from Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          if [ ! -f "download_telegram.js" ]; then
            echo "❌ download_telegram.js not found in repository!"
            exit 1
          fi
          sudo rm -rf /tmp/telegram_downloads
          mkdir -p /tmp/telegram_downloads
          export POST_URLS="${{ github.event.inputs.post_urls }}"
          node download_telegram.js
          if [ $? -eq 0 ] && [ -f "/tmp/all_post_dirs.txt" ] && [ -s "/tmp/all_post_dirs.txt" ]; then
            echo "✅ All downloads completed!"
            cat /tmp/all_post_dirs.txt
          else
            echo "❌ Download failed!"
            exit 1
          fi

      - name: Process and create split ZIP archives
        run: |
          SPLIT_THRESHOLD_MB=45
          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          mkdir -p downloads

          echo "=== Contents of /tmp/all_post_dirs.txt ==="
          cat /tmp/all_post_dirs.txt
          echo "==========================================="

          while IFS= read -r POST_DIR; do
            POST_DIR=$(echo "$POST_DIR" | xargs)
            if [ -z "$POST_DIR" ]; then
              continue
            fi
            if [ ! -d "$POST_DIR" ]; then
              echo "⚠️ Directory not found: $POST_DIR"
              continue
            fi
            
            FOLDER_NAME=$(basename "$POST_DIR")
            TARGET_DIR="$BACKUP_DIR/$FOLDER_NAME"
            mkdir -p "$TARGET_DIR"
            
            echo "Processing: $FOLDER_NAME"
            echo "Source: $POST_DIR"
            echo "Target: $TARGET_DIR"
            
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ]; then
                FILENAME=$(basename "$FILE")
                if [[ "$FILENAME" != "post_info.json" ]] && [[ "$FILENAME" != "message_text.txt" ]] && [[ "$FILENAME" != "no_media.txt" ]] && [[ "$FILENAME" != "temp_download" ]]; then
                  if [ -s "$FILE" ]; then
                    FILE_SIZE=$(stat -c%s "$FILE")
                    FILE_SIZE_MB=$(( FILE_SIZE / 1024 / 1024 ))
                    echo "  Processing: $FILENAME (${FILE_SIZE_MB}MB)"
                    
                    cp "$FILE" "$TARGET_DIR/$FILENAME"
                    
                    if [ "$FILE_SIZE" -gt $(( SPLIT_THRESHOLD_MB * 1024 * 1024 )) ]; then
                      echo "    Splitting into ${SPLIT_THRESHOLD_MB}MB parts..."
                      cd "$TARGET_DIR"
                      zip -s ${SPLIT_THRESHOLD_MB}m "${FILENAME%.*}.zip" "$FILENAME"
                      if [ $? -eq 0 ]; then
                        rm -f "$FILENAME"
                        PARTS_COUNT=$(ls -1 "$TARGET_DIR"/*.zip "$TARGET_DIR"/*.z[0-9]* 2>/dev/null | wc -l)
                        TOTAL_SIZE=0
                        for PART in "$TARGET_DIR"/*; do
                          [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART" 2>/dev/null || echo 0)))
                        done
                        TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
                        node -e "const { createReadme } = require('./utils.js'); createReadme('$TARGET_DIR', '$FOLDER_NAME', '$TOTAL_SIZE_MB', '$PARTS_COUNT');"
                        echo "    ✅ Created ${PARTS_COUNT} parts (${TOTAL_SIZE_MB}MB)"
                      else
                        echo "    ❌ Zip failed"
                      fi
                      cd - > /dev/null
                    else
                      echo "    Creating single zip..."
                      cd "$TARGET_DIR"
                      zip "${FILENAME%.*}.zip" "$FILENAME"
                      if [ $? -eq 0 ]; then
                        rm -f "$FILENAME"
                        SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1024 / 1024" | bc)
                        node -e "const { createSimpleReadme } = require('./utils.js'); createSimpleReadme('$TARGET_DIR', '$FOLDER_NAME', '$SIZE_MB');"
                        echo "    ✅ Created zip (${SIZE_MB}MB)"
                      else
                        echo "    ❌ Zip failed"
                      fi
                      cd - > /dev/null
                    fi
                  fi
                fi
              fi
            done
          done < /tmp/all_post_dirs.txt

          echo ""
          echo "=== Backup folder contents ==="
          ls -la "$BACKUP_DIR/"
          for DIR in "$BACKUP_DIR"/*/; do
            echo "Contents of $(basename "$DIR"):"
            ls -la "$DIR"
          done

      - name: Copy to downloads and update README
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          
          mkdir -p downloads
          
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            for FOLDER in "$BACKUP_DIR"/*; do
              if [ -d "$FOLDER" ]; then
                FOLDER_NAME=$(basename "$FOLDER")
                rm -rf "downloads/$FOLDER_NAME"
                cp -r "$FOLDER" "downloads/$FOLDER_NAME"
                echo "✅ Copied: $FOLDER_NAME"
              fi
            done
          fi
          
          echo ""
          echo "=== Final downloads structure ==="
          ls -la downloads/
          for DIR in downloads/*/; do
            echo "Contents of $(basename "$DIR"):"
            ls -la "$DIR"
          done
          
          node -e "
            const fs = require('fs');
            let content = '# 📥 Telegram Downloader\n\nدانلود خودکار پست‌های تلگرام\n\n## 📁 Downloads\n\n';
            const dirs = fs.readdirSync('downloads').filter(f => fs.statSync(\`downloads/\${f}\`).isDirectory());
            for (const dir of dirs) {
              const size = require('child_process').execSync(\`du -sh downloads/\${dir}\`).toString().split('\t')[0];
              content += \`- **\${dir}** (\${size}) - [View](./downloads/\${dir}/)\n\`;
            }
            content += '\n---\n*Created by [avasam.ir](https://avasam.ir)*\n';
            fs.writeFileSync('README.md', content);
            console.log('✅ README files created');
          "

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi
          git add -f downloads/
          git add README.md
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Push attempt $i/5..."
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi
          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "📁 Files are stored in the 'downloads' folder"
          echo "=========================================="
