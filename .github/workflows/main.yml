name: ⬇️ Download Telegram Posts

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (هر لینک در یک خط)'
        required: true
        type: string
        placeholder: |
          https://t.me/username/123
          https://t.me/username/456
      mode:
        description: '📦 حالت دانلود'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      password:
        description: '🔒 رمز عبور برای فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  save-file:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          
          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          lfs: false  # مهم: غیرفعال کردن LFS در checkout

      - name: Remove Git LFS tracking
        run: |
          # حذف تنظیمات LFS از مخزن
          git lfs uninstall 2>/dev/null || true
          
          # حذف فایل .gitattributes اگر وجود دارد
          rm -f .gitattributes
          
          # حذف اشاره‌گرهای LFS از تاریخچه (اختیاری)
          git config --local --unset filter.lfs.process 2>/dev/null || true
          git config --local --unset filter.lfs.smudge 2>/dev/null || true
          git config --local --unset filter.lfs.clean 2>/dev/null || true
          
          echo "✅ Git LFS disabled"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3 aria2

      - name: Configure Git (without LFS)
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # مطمئن شوید که LFS غیرفعال است
          git config --global filter.lfs.smudge ""
          git config --global filter.lfs.clean ""
          
          echo "Git configured (LFS disabled)"

      - name: Download from Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          if [ ! -f "download_telegram.js" ]; then
            echo "❌ download_telegram.js not found in repository!"
            exit 1
          fi
          
          # پاکسازی پوشه قبلی
          sudo rm -rf /tmp/telegram_downloads
          mkdir -p /tmp/telegram_downloads
          
          # ارسال همه لینک‌ها به صورت یکجا به اسکریپت
          export POST_URLS="${{ github.event.inputs.post_urls }}"
          export OUTPUT_FILE="/tmp/downloaded_post_dir.txt"
          
          node download_telegram.js
          
          if [ $? -eq 0 ] && [ -f "/tmp/all_post_dirs.txt" ] && [ -s "/tmp/all_post_dirs.txt" ]; then
            echo "✅ All downloads completed!"
            cat /tmp/all_post_dirs.txt
          else
            echo "❌ Download failed!"
            exit 1
          fi

      - name: Download and process files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"

          SPLIT_THRESHOLD_MB=45
          SPLIT_THRESHOLD_BYTES=$(( SPLIT_THRESHOLD_MB * 1024 * 1024 ))

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt

          mkdir -p downloads tmp_downloads

          check_disk_space() {
            local AVAILABLE_SPACE=$(df --output=avail /tmp | tail -n 1)
            local AVAILABLE_GB=$((AVAILABLE_SPACE / 1024 / 1024))
            echo "Available disk space: ${AVAILABLE_GB}GB"
            if [ "$AVAILABLE_SPACE" -lt 1048576 ]; then
              echo "⚠️ WARNING: Low disk space! Only ${AVAILABLE_GB}GB remaining"
              return 1
            fi
            return 0
          }

          cleanup_temp_files() {
            echo "Cleaning up temporary files..."
            rm -f tmp_downloads/*.aria2 2>/dev/null
            rm -f tmp_downloads/*.part 2>/dev/null
            sync
          }

          RANDOM_WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river" "ocean" "mountain")

          get_random_word() {
            echo "${RANDOM_WORDS[$RANDOM % ${#RANDOM_WORDS[@]}]}_$RANDOM"
          }

          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ] || [ -d "$BACKUP_DIR/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          # بررسی محتوای all_post_dirs.txt
          echo "Contents of /tmp/all_post_dirs.txt:"
          cat /tmp/all_post_dirs.txt
          echo ""
          
          # کپی فایل‌های دانلود شده از تلگرام به tmp_downloads
          echo "Copying downloaded files from Telegram..."
          while IFS= read -r POST_DIR; do
            if [ -z "$POST_DIR" ] || [ ! -d "$POST_DIR" ]; then
              echo "⚠️ Directory not found or empty: '$POST_DIR'"
              continue
            fi
            
            echo "📁 Processing directory: $POST_DIR"
            
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                BASENAME=$(basename "$FILE")
                # فقط فایل‌های رسانه را کپی کن (نه فایل‌های json و txt)
                if [[ "$BASENAME" != *".json"* ]] && [[ "$BASENAME" != *"info"* ]] && [[ "$BASENAME" != *"message"* ]]; then
                  cp "$FILE" "tmp_downloads/$BASENAME"
                  echo "  ✅ Copied: $BASENAME ($(du -h "$FILE" | cut -f1))"
                else
                  echo "  ⏭️ Skipped: $BASENAME (metadata file)"
                fi
              fi
            done
          done < /tmp/all_post_dirs.txt

          # نمایش فایل‌های کپی شده
          echo ""
          echo "Files in tmp_downloads:"
          ls -la tmp_downloads/ 2>/dev/null || echo "  (empty)"
          echo ""

          check_disk_space

          # اگر فایلی برای پردازش وجود ندارد
          if [ -z "$(ls -A tmp_downloads 2>/dev/null)" ]; then
            echo "❌ No files were copied to tmp_downloads!"
            echo "Checking original download directories:"
            while IFS= read -r POST_DIR; do
              echo "  - $POST_DIR"
              ls -la "$POST_DIR" 2>/dev/null || echo "    (not accessible)"
            done < /tmp/all_post_dirs.txt
            exit 1
          fi

          # پردازش فایل‌ها
          for FILE in tmp_downloads/*; do
            [ -f "$FILE" ] || continue

            if [ ! -s "$FILE" ]; then
              echo "WARNING: Skipping empty file: $FILE"
              rm -f "$FILE"
              continue
            fi

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -le 0 ]; then
              echo "WARNING: File has zero or invalid size: $FILE"
              rm -f "$FILE"
              continue
            fi

            BASENAME=$(basename "$FILE")
            BASENAME_NO_EXT="${BASENAME%.*}"
            EXT="${BASENAME##*.}"
            
            # تشخیص فرمت فایل
            if [ "$BASENAME" = "$BASENAME_NO_EXT" ] || [ -z "$EXT" ] || [ "$EXT" = "$BASENAME" ]; then
              DETECTED_TYPE=$(file --mime-type -b "$FILE" | cut -d'/' -f2)
              case "$DETECTED_TYPE" in
                "mp4") EXT="mp4" ;;
                "mp3") EXT="mp3" ;;
                "mpeg") EXT="mpg" ;;
                "pdf") EXT="pdf" ;;
                "zip") EXT="zip" ;;
                "rar") EXT="rar" ;;
                "x-rar") EXT="rar" ;;
                "x-msdos-program") EXT="exe" ;;
                "x-executable") EXT="exe" ;;
                "x-msdownload") EXT="exe" ;;
                "plain") EXT="txt" ;;
                "jpeg") EXT="jpg" ;;
                "png") EXT="png" ;;
                "gif") EXT="gif" ;;
                "x-7z-compressed") EXT="7z" ;;
                "x-tar") EXT="tar" ;;
                "gzip") EXT="gz" ;;
                *) EXT="" ;;
              esac
              if [ -n "$EXT" ]; then
                BASENAME_WITH_EXT="${BASENAME_NO_EXT}.${EXT}"
              else
                BASENAME_WITH_EXT="$BASENAME"
              fi
            else
              BASENAME_WITH_EXT="$BASENAME"
            fi

            # استفاده از نام فایل به عنوان نام پوشه (همان channel_postid)
            FOLDER_NAME="$BASENAME_NO_EXT"
            TARGET_DIR="$BACKUP_DIR/$FOLDER_NAME"
            mkdir -p "$TARGET_DIR"

            check_disk_space

            if [ "$SIZE" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
              echo "$BASENAME is $(( SIZE / 1024 / 1024 ))MB - splitting into ${SPLIT_THRESHOLD_MB}MB parts"

              cd "$TARGET_DIR"
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -0 -P "${ZIP_PASSWORD}" -s ${SPLIT_THRESHOLD_MB}m "${FOLDER_NAME}.zip" "$FILE"
              else
                zip -0 -s ${SPLIT_THRESHOLD_MB}m "${FOLDER_NAME}.zip" "$FILE"
              fi
              cd - > /dev/null
              
              rm -f "$FILE"
              
              PARTS_COUNT=$(ls -1 "$TARGET_DIR"/*.zip "$TARGET_DIR"/*.z[0-9]* 2>/dev/null | wc -l)
              
              TOTAL_SIZE=0
              for PART in "$TARGET_DIR"/*; do
                [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART" 2>/dev/null || echo 0)))
              done
              TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)

              # ایجاد README
              cat > "$TARGET_DIR/README.md" << EOF
# 📥 ${FOLDER_NAME}

**Size:** ${TOTAL_SIZE_MB} MB  
**Parts:** ${PARTS_COUNT}  
**Status:** ✅ Complete

---

## 📦 Download Links

| Part | File |
|------|------|
EOF
              for PART in $(ls -1 "$TARGET_DIR"/*.zip "$TARGET_DIR"/*.z[0-9]* 2>/dev/null | sort); do
                PART_NAME=$(basename "$PART")
                echo "| ${PART_NAME##*.} | \`${PART_NAME}\` |" >> "$TARGET_DIR/README.md"
              done

              cat >> "$TARGET_DIR/README.md" << 'EOF'

---

## 📖 How to Extract

1. **Download ALL parts** to the same folder
2. **Extract** the `.zip` file

*Created by [avasam.ir](https://avasam.ir)*
EOF
              echo "  ✅ Created ${PARTS_COUNT} part(s) (${TOTAL_SIZE_MB}MB total)"

            else
              echo "$BASENAME - creating zip archive"

              cd "$TARGET_DIR"
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -0 -P "${ZIP_PASSWORD}" "${FOLDER_NAME}.zip" "$FILE"
              else
                zip -0 "${FOLDER_NAME}.zip" "$FILE"
              fi
              cd - > /dev/null
              
              rm -f "$FILE"
              SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
              
              cat > "$TARGET_DIR/README.md" << EOF
# 📥 ${FOLDER_NAME}

**Size:** ${SIZE_MB} MB  
**Status:** ✅ Complete

---

## 📦 Download

\`${FOLDER_NAME}.zip\`

---

## 📖 How to Extract

1. **Download** the zip file
2. **Extract** with any archive tool

*Created by [avasam.ir](https://avasam.ir)*
EOF
              echo "  ✅ Created zip archive (${SIZE_MB}MB)"
            fi
          done
          
          rm -rf tmp_downloads
          cleanup_temp_files
          
          echo ""
          echo "===== Backup folder contents ====="
          find "$BACKUP_DIR" -type f | head -50
          echo ""
          echo "===== Disk space after processing ====="
          df -h /tmp
          
      - name: Update README.md with download links
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"

          mkdir -p downloads
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            cp -r "$BACKUP_DIR"/* downloads/
          fi

          FOLDERS=$(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)

          if [ -z "$FOLDERS" ]; then
            echo "No folders found in downloads"
            exit 0
          fi

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          {
            echo "# Downloaded list :"
            echo ""
            echo "$FOLDERS" | while read -r FOLDER; do
              if [ -n "$FOLDER" ]; then
                FOLDER_ENCODED=$(urlencode "${FOLDER}")
                echo "- [${FOLDER}](./${FOLDER_ENCODED})"
              fi
            done
            echo ""
            echo "---"
            echo ""
            echo "*This tool created by [avasam.ir](https://avasam.ir)*"
          } > "downloads/README.md"

          echo "downloads/README.md created with list of downloaded files"

          SECTION_TITLE="فایل های دانلود شده در گیتهاب شما :"

          if [ ! -f "README.md" ]; then
            echo "# AVASAM Downloader" > README.md
            echo "" >> README.md
            echo "https://avasam.ir" >> README.md
            echo "" >> README.md
          fi

          if grep -q "$SECTION_TITLE" README.md; then
            sed -i "/$SECTION_TITLE/,/^---$/d" README.md
            sed -i '${/^$/d;}' README.md
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "## $SECTION_TITLE"
            echo ""
            COUNTER=1
            echo "$FOLDERS" | while read -r FOLDER; do
              if [ -n "$FOLDER" ]; then
                FOLDER_ENCODED=$(urlencode "${FOLDER}")
                echo "${COUNTER}. [$FOLDER]($REPO_URL/$FOLDER_ENCODED)"
                echo ""
                COUNTER=$((COUNTER + 1))
              fi
            done
            echo "---"
          } >> README.md

          echo "README.md updated with download links"

      - name: Commit & Push (without LFS)
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          
          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi
          
          # اطمینان از غیرفعال بودن LFS برای push
          git lfs uninstall 2>/dev/null || true
          
          # اضافه کردن فایل‌ها به صورت عادی (بدون LFS)
          git add -f downloads/
          git add README.md
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              
              # push عادی بدون LFS
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "📁 Files are stored directly in the repository (not LFS)"
          echo "📦 Each file is split into 45MB ZIP parts"
          echo "=========================================="
