name: ⬇️ Download Entire Channel History

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: '🔗 لینک کانال تلگرام (مثال: https://t.me/username)'
        required: true
        type: string
      limit:
        description: 'تعداد پیام‌های آخر برای دانلود (پیش‌فرض: همه)'
        required: false
        default: '0'
        type: string
      include_media:
        description: 'دانلود فایل‌های مدیا (true/false)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  download-channel-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          
          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 10 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Need at least 10GB."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file jq

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 50m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Download Channel History
        id: download
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          CHANNEL_URL: ${{ github.event.inputs.channel_url }}
          LIMIT: ${{ github.event.inputs.limit }}
          INCLUDE_MEDIA: ${{ github.event.inputs.include_media }}
        run: |
          cat > download_channel.js << 'EOF'
          const { TelegramClient } = require("telegram");
          const { StringSession } = require("telegram/sessions");
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const apiId = parseInt(process.env.API_ID);
          const apiHash = process.env.API_HASH;
          const stringSession = process.env.STRING_SESSION;
          const channelUrl = process.env.CHANNEL_URL;
          const limit = parseInt(process.env.LIMIT) || 0;
          const includeMedia = process.env.INCLUDE_MEDIA === 'true';

          let lastLoggedPercent = 0;
          let totalMessages = 0;
          let downloadedMessages = 0;
          let totalMediaSize = 0;

          function sanitizeFilename(filename) {
            return filename.replace(/[<>:"|?*\\/]/g, '_').replace(/\s+/g, '_');
          }

          async function extractChatId(url) {
            const patterns = [
              /https?:\/\/t\.me\/(?:c\/)?([^\/]+)/,
              /https?:\/\/telegram\.me\/(?:c\/)?([^\/]+)/,
            ];
            
            let match = null;
            for (const pattern of patterns) {
              match = url.match(pattern);
              if (match) break;
            }
            
            if (!match) {
              throw new Error(`Invalid Telegram channel URL format: ${url}`);
            }
            
            let chatId = match[1];
            
            if (chatId === 'c' || chatId.startsWith('c/')) {
              chatId = '-100' + chatId.replace('c/', '').replace('c', '');
            } else if (!isNaN(parseInt(chatId)) && chatId.length > 5) {
              chatId = '-100' + chatId;
            }
            
            return chatId;
          }

          async function downloadMediaFile(client, media, outputPath) {
            return new Promise(async (resolve, reject) => {
              try {
                let lastPercent = 0;
                const filePath = await client.downloadMedia(media, {
                  outputFile: outputPath,
                  progressCallback: (downloaded, total) => {
                    const percent = (downloaded / total * 100);
                    if (Math.floor(percent / 10) > Math.floor(lastPercent / 10) || percent === 100) {
                      lastPercent = percent;
                      const downloadedMB = downloaded / 1024 / 1024;
                      const totalMB = total / 1024 / 1024;
                      process.stdout.write(`\r         📊 ${percent.toFixed(1)}% (${downloadedMB.toFixed(2)}MB / ${totalMB.toFixed(2)}MB)`);
                    }
                  }
                });
                
                if (filePath && fs.existsSync(filePath)) {
                  const stats = fs.statSync(filePath);
                  if (stats.size > 0) {
                    totalMediaSize += stats.size;
                    resolve(filePath);
                  } else {
                    reject(new Error("File is empty"));
                  }
                } else {
                  reject(new Error("Download failed"));
                }
              } catch (err) {
                reject(err);
              }
            });
          }

          async function getFileNameFromMedia(media, messageId, index) {
            if (media.document && media.document.attributes) {
              for (const attr of media.document.attributes) {
                if (attr.className === 'DocumentAttributeFilename') {
                  return sanitizeFilename(attr.fileName);
                }
              }
            }
            
            const mediaType = media.className;
            if (mediaType === 'MessageMediaPhoto') {
              return `photo_${messageId}.jpg`;
            } else if (mediaType === 'MessageMediaDocument') {
              return `document_${messageId}_${index}`;
            }
            
            return `media_${messageId}_${index}`;
          }

          async function processMessage(client, message, channelName, outputDir, messageIndex, total) {
            const messageId = message.id;
            const messageDir = path.join(outputDir, String(messageId));
            fs.mkdirSync(messageDir, { recursive: true });
            
            const messageInfo = {
              id: message.id,
              date: message.date,
              text: message.text || '',
              hasMedia: !!message.media,
              views: message.views || 0,
              forwards: message.forwards || 0,
              replies: message.replies ? message.replies.replies : 0
            };
            
            fs.writeFileSync(path.join(messageDir, 'message.json'), JSON.stringify(messageInfo, null, 2));
            
            if (message.text && message.text.length > 0) {
              fs.writeFileSync(path.join(messageDir, 'message.txt'), message.text);
            }
            
            if (includeMedia && message.media) {
              let fileName = await getFileNameFromMedia(message.media, messageId, 0);
              let outputPath = path.join(messageDir, fileName);
              
              if (!path.extname(outputPath) || path.extname(outputPath) === '') {
                const tempPath = path.join(messageDir, 'temp');
                try {
                  await downloadMediaFile(client, message.media, tempPath);
                  
                  if (fs.existsSync(tempPath)) {
                    const fileType = execSync(`file --mime-type -b "${tempPath}"`).toString().trim();
                    const extMap = {
                      'video/mp4': '.mp4', 'video/x-matroska': '.mkv', 'video/webm': '.webm',
                      'video/quicktime': '.mov', 'video/x-msvideo': '.avi',
                      'audio/mpeg': '.mp3', 'audio/mp4': '.m4a', 'audio/ogg': '.ogg',
                      'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif',
                      'application/pdf': '.pdf', 'application/zip': '.zip',
                      'application/x-rar': '.rar', 'application/x-7z-compressed': '.7z'
                    };
                    const ext = extMap[fileType] || '';
                    const finalPath = outputPath + ext;
                    fs.renameSync(tempPath, finalPath);
                  }
                } catch (err) {
                  console.log(`\n      ⚠️ Failed to download media for message ${messageId}: ${err.message}`);
                }
              } else {
                try {
                  await downloadMediaFile(client, message.media, outputPath);
                } catch (err) {
                  console.log(`\n      ⚠️ Failed to download media for message ${messageId}: ${err.message}`);
                }
              }
            }
            
            downloadedMessages++;
            
            const percent = (downloadedMessages / total * 100);
            if (Math.floor(percent / 5) > Math.floor((downloadedMessages - 1) / total * 100 / 5)) {
              console.log(`   📊 ${percent.toFixed(1)}% (${downloadedMessages}/${total} messages) | Media: ${(totalMediaSize/1024/1024).toFixed(2)}MB`);
            }
          }

          async function main() {
            let client = null;
            
            try {
              console.log('🚀 Connecting to Telegram...');
              console.log(`📌 Channel: ${channelUrl}`);
              console.log(`📌 Limit: ${limit === 0 ? 'All messages' : limit + ' messages'}`);
              console.log(`📌 Include Media: ${includeMedia}\n`);
              
              const session = new StringSession(stringSession);
              client = new TelegramClient(session, apiId, apiHash, {
                connectionRetries: 5,
                useWSS: true,
              });
              
              await client.start({
                phoneNumber: () => Promise.reject(new Error('Use STRING_SESSION')),
                phoneCode: () => Promise.reject(new Error('Use STRING_SESSION')),
                password: () => Promise.reject(new Error('Use STRING_SESSION')),
                onError: (err) => console.error('Connection error:', err),
              });
              
              console.log('✅ Connected successfully!\n');
              
              const chatId = await extractChatId(channelUrl);
              console.log(`📨 Fetching channel: ${chatId}`);
              
              let chat;
              if (chatId.toString().startsWith('-100')) {
                chat = await client.getEntity(parseInt(chatId));
              } else {
                chat = await client.getEntity(chatId);
              }
              
              let channelName = "unknown_channel";
              if (chat.username) {
                channelName = chat.username;
              } else if (chat.title) {
                channelName = sanitizeFilename(chat.title);
              } else {
                channelName = chatId.toString().replace('-100', '');
              }
              
              console.log(`📁 Channel Name: ${channelName}`);
              console.log(`📁 Fetching messages...\n`);
              
              const outputDir = `/tmp/channel_export/${channelName}`;
              fs.mkdirSync(outputDir, { recursive: true });
              
              const messages = [];
              let offsetId = 0;
              let hasMore = true;
              
              while (hasMore) {
                const batch = await client.getMessages(chat, {
                  limit: 100,
                  offsetId: offsetId,
                });
                
                if (batch.length === 0) break;
                
                for (const msg of batch) {
                  messages.push(msg);
                }
                
                offsetId = batch[batch.length - 1].id;
                console.log(`   📥 Fetched ${messages.length} messages so far...`);
                
                if (limit > 0 && messages.length >= limit) {
                  hasMore = false;
                  break;
                }
              }
              
              let finalMessages = messages;
              if (limit > 0 && messages.length > limit) {
                finalMessages = messages.slice(0, limit);
              }
              
              totalMessages = finalMessages.length;
              console.log(`\n✅ Total messages to download: ${totalMessages}\n`);
              
              const channelInfo = {
                name: channelName,
                url: channelUrl,
                chatId: chatId,
                totalMessages: totalMessages,
                exportDate: new Date().toISOString(),
                includeMedia: includeMedia
              };
              fs.writeFileSync(path.join(outputDir, 'channel_info.json'), JSON.stringify(channelInfo, null, 2));
              
              console.log(`📥 Processing messages...\n`);
              
              for (let i = 0; i < finalMessages.length; i++) {
                const msg = finalMessages[i];
                process.stdout.write(`\r   📍 Processing message ${i + 1}/${totalMessages} (ID: ${msg.id})`);
                await processMessage(client, msg, channelName, outputDir, i, totalMessages);
              }
              
              console.log(`\n`);
              
              const summary = {
                channel: channelName,
                totalMessages: totalMessages,
                totalSizeMB: (totalMediaSize / 1024 / 1024).toFixed(2),
                exportDate: new Date().toISOString(),
                includeMedia: includeMedia
              };
              fs.writeFileSync(path.join(outputDir, 'export_summary.json'), JSON.stringify(summary, null, 2));
              
              let htmlContent = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n'
              htmlContent += `<title>${channelName} - Channel Export</title>\n`
              htmlContent += '<style>\nbody { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }\n'
              htmlContent += '.container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }\n'
              htmlContent += '.message { border-bottom: 1px solid #eee; padding: 15px; margin-bottom: 10px; }\n'
              htmlContent += '.message-id { color: #666; font-size: 12px; }\n'
              htmlContent += '.message-date { color: #999; font-size: 12px; }\n'
              htmlContent += '.message-text { margin-top: 10px; }\n'
              htmlContent += '.media { margin-top: 10px; }\n'
              htmlContent += 'img, video { max-width: 100%; max-height: 300px; }\n'
              htmlContent += 'h1 { color: #333; }\n'
              htmlContent += '.summary { background: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px; }\n'
              htmlContent += '</style>\n</head>\n<body>\n<div class="container">\n'
              htmlContent += `<h1>📱 ${channelName}</h1>\n`
              htmlContent += `<div class="summary">\n<strong>Export Summary:</strong><br>\n`
              htmlContent += `Total Messages: ${totalMessages}<br>\n`
              htmlContent += `Total Size: ${summary.totalSizeMB} MB<br>\n`
              htmlContent += `Export Date: ${new Date().toLocaleString()}<br>\n`
              htmlContent += `Media Included: ${includeMedia}\n</div>\n`
              
              for (const msg of finalMessages) {
                const messageDate = new Date(msg.date * 1000).toLocaleString();
                htmlContent += `<div class="message">\n`
                htmlContent += `<div class="message-id">Message ID: ${msg.id}</div>\n`
                htmlContent += `<div class="message-date">${messageDate}</div>\n`
                if (msg.text) {
                  htmlContent += `<div class="message-text">${msg.text.replace(/\n/g, '<br>')}</div>\n`
                }
                if (includeMedia && msg.media) {
                  htmlContent += `<div class="media"><a href="${msg.id}/">View Media Files</a></div>\n`
                }
                htmlContent += `</div>\n`
              }
              
              htmlContent += '</div>\n</body>\n</html>'
              
              fs.writeFileSync(path.join(outputDir, 'index.html'), htmlContent);
              
              const messageDirs = finalMessages.map(m => path.join(outputDir, String(m.id)));
              fs.writeFileSync('/tmp/message_dirs.txt', messageDirs.join('\n'));
              fs.writeFileSync('/tmp/channel_export_dir.txt', outputDir);
              
              const totalSizeMB = totalMediaSize / 1024 / 1024;
              
              console.log(`\n${'='.repeat(60)}`);
              console.log(`📊 EXPORT SUMMARY`);
              console.log(`${'='.repeat(60)}`);
              console.log(`✅ Channel: ${channelName}`);
              console.log(`✅ Total messages: ${totalMessages}`);
              console.log(`✅ Total media size: ${totalSizeMB.toFixed(2)}MB`);
              console.log(`✅ Export directory: ${outputDir}`);
              console.log(`${'='.repeat(60)}`);
              
            } catch (error) {
              console.error('❌ Fatal error:', error);
              process.exit(1);
            } finally {
              if (client) {
                try {
                  console.log('\n👋 Disconnecting from Telegram...');
                  await client.disconnect();
                  console.log('✅ Disconnected successfully');
                } catch (err) {
                  console.log('⚠️ Disconnect warning:', err.message);
                }
              }
            }
          }
          
          process.on('unhandledRejection', (err) => {
            if (err.message && err.message.includes('TIMEOUT')) {
              console.log('⚠️ Ignoring timeout error (download completed successfully)');
              process.exit(0);
            } else {
              console.error('Unhandled rejection:', err);
              process.exit(1);
            }
          });
          
          main().catch(err => {
            console.error('Main error:', err);
            process.exit(1);
          });
          EOF

          node download_channel.js
          
          DOWNLOAD_EXIT=$?
          if [ $DOWNLOAD_EXIT -eq 0 ] || ([ -f "/tmp/channel_export_dir.txt" ] && [ -s "/tmp/channel_export_dir.txt" ]); then
            echo "Channel export completed successfully"
            exit 0
          else
            exit $DOWNLOAD_EXIT
          fi

      - name: Split Large Files and Create Archive
        run: |
          if [ ! -f "/tmp/channel_export_dir.txt" ]; then
            echo "❌ No export found!"
            exit 1
          fi
          
          EXPORT_DIR=$(cat /tmp/channel_export_dir.txt)
          CHANNEL_NAME=$(basename "$EXPORT_DIR")
          
          if [ ! -d "$EXPORT_DIR" ]; then
            echo "❌ Export directory not found: $EXPORT_DIR"
            exit 1
          fi
          
          BACKUP_DIR="/tmp/backup_$$"
          mkdir -p "$BACKUP_DIR/$CHANNEL_NAME"
          
          echo "📦 Processing files for channel: $CHANNEL_NAME"
          echo ""
          
          # Split any large files (>45MB) into smaller chunks
          SPLIT_SIZE_MB=45
          LARGE_FILES=$(find "$EXPORT_DIR" -type f -size +45M 2>/dev/null)
          
          if [ -n "$LARGE_FILES" ]; then
            echo "📀 Found large files, splitting into ${SPLIT_SIZE_MB}MB chunks..."
            echo "$LARGE_FILES" | while read -r FILE; do
              FILE_SIZE=$(stat -c%s "$FILE" | awk '{printf "%.2fMB", $1/1024/1024}')
              echo "   🔪 Splitting: $(basename "$FILE") (${FILE_SIZE})"
              
              FILE_DIR=$(dirname "$FILE")
              FILE_BASE=$(basename "$FILE")
              FILE_NAME="${FILE_BASE%.*}"
              
              cd "$FILE_DIR"
              
              # Create split zip archive for this file
              zip -s ${SPLIT_SIZE_MB}m "${FILE_NAME}_split.zip" "$FILE_BASE" > /dev/null 2>&1
              
              # Remove original large file
              rm -f "$FILE_BASE"
              
              # Rename split files
              for part in "${FILE_NAME}_split".zip*; do
                if [ -f "$part" ]; then
                  NEW_NAME=$(echo "$part" | sed "s/_split//")
                  mv "$part" "$NEW_NAME"
                fi
              done
              
              cd - > /dev/null
              echo "   ✅ Split into multiple ${SPLIT_SIZE_MB}MB parts"
            done
          fi
          
          echo ""
          echo "📦 Copying files to backup directory..."
          
          # Copy processed directory
          cp -r "$EXPORT_DIR"/* "$BACKUP_DIR/$CHANNEL_NAME/"
          
          # Also copy any split zip files
          find "$EXPORT_DIR" -name "*.zip" -o -name "*.z[0-9]*" 2>/dev/null | while read -r FILE; do
            REL_PATH=${FILE#$EXPORT_DIR/}
            TARGET_DIR="$BACKUP_DIR/$CHANNEL_NAME/$(dirname "$REL_PATH")"
            mkdir -p "$TARGET_DIR"
            cp "$FILE" "$TARGET_DIR/"
          done
          
          cd "$BACKUP_DIR"
          
          # Create split archive of entire channel
          ARCHIVE_NAME="${CHANNEL_NAME}_channel_export"
          SPLIT_SIZE_MB=45
          
          echo ""
          echo "📀 Creating split archive of entire channel (${SPLIT_SIZE_MB}MB per part)..."
          zip -r -0 -s ${SPLIT_SIZE_MB}m "${ARCHIVE_NAME}.zip" "$CHANNEL_NAME" > /dev/null 2>&1
          
          # Create folder for split parts
          FOLDER_NAME="${CHANNEL_NAME}_channel_export"
          mkdir -p "$BACKUP_DIR/$FOLDER_NAME"
          
          # Move all parts to folder
          mv ${ARCHIVE_NAME}.zip* "$BACKUP_DIR/$FOLDER_NAME/" 2>/dev/null || true
          
          cd - > /dev/null
          
          # Count parts and calculate total size
          LINK_NUM=0
          TOTAL_ARCHIVE_SIZE=0
          
          for part_file in $(ls "$BACKUP_DIR/$FOLDER_NAME/"*.zip "$BACKUP_DIR/$FOLDER_NAME/"*.z[0-9]* 2>/dev/null | sort); do
            [ -f "$part_file" ] || continue
            PART_SIZE=$(stat -c%s "$part_file" 2>/dev/null || echo 0)
            TOTAL_ARCHIVE_SIZE=$((TOTAL_ARCHIVE_SIZE + PART_SIZE))
            LINK_NUM=$((LINK_NUM + 1))
          done
          
          TOTAL_ARCHIVE_SIZE_MB=$(echo "scale=2; $TOTAL_ARCHIVE_SIZE / 1024 / 1024" | bc)
          
          # Create README for the export
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          FOLDER_ENCODED=$(urlencode "${FOLDER_NAME}")
          DOWNLOAD_LINKS_MD=""
          LINK_NUM=0
          
          for part_file in $(ls "$BACKUP_DIR/$FOLDER_NAME/"*.zip "$BACKUP_DIR/$FOLDER_NAME/"*.z[0-9]* 2>/dev/null | sort); do
            [ -f "$part_file" ] || continue
            PART_BASENAME=$(basename "$part_file")
            PART_ENCODED=$(urlencode "${PART_BASENAME}")
            RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${FOLDER_ENCODED}/${PART_ENCODED}"
            LINK_NUM=$((LINK_NUM + 1))
            DOWNLOAD_LINKS_MD="${DOWNLOAD_LINKS_MD}| ${LINK_NUM} | \`${PART_BASENAME}\` | [Download](${RAW_LINK}) |"$'\n'
          done
          
          CHANNEL_URL="${{ github.event.inputs.channel_url }}"
          
          {
            echo "# 📱 Channel Export: ${CHANNEL_NAME}"
            echo ""
            echo "---"
            echo ""
            echo "## 📊 Export Information"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Channel** | [${CHANNEL_URL}](${CHANNEL_URL}) |"
            echo "| **Export Date** | $(date '+%Y-%m-%d %H:%M:%S') |"
            echo "| **Total Size** | ${TOTAL_ARCHIVE_SIZE_MB} MB (${LINK_NUM} parts) |"
            echo "| **Split Size** | 45 MB per part |"
            echo "| **Status** | ✅ **Complete** |"
            echo ""
            echo "---"
            echo ""
            echo "## 🔗 Download Links"
            echo ""
            echo "| # | File | Link |"
            echo "|---|------|------|"
            printf '%s' "${DOWNLOAD_LINKS_MD}"
            echo ""
            echo "---"
            echo ""
            echo "## 📖 How to Extract"
            echo ""
            echo "1. **Download all parts** (\`.zip\`, \`.z01\`, \`.z02\`...)"
            echo "2. **Open** \`${ARCHIVE_NAME}.zip\` with WinRAR or 7-Zip"
            echo "3. **Extract** — all parts combine automatically"
            echo "4. Open \`index.html\` in your browser to browse messages"
            echo ""
            echo "---"
            echo ""
            echo "## 📁 Folder Structure After Extraction"
            echo ""
            echo '```'
            echo "${CHANNEL_NAME}/"
            echo "├── channel_info.json      # Channel metadata"
            echo "├── export_summary.json    # Export statistics"
            echo "├── index.html            # Browse all messages"
            echo "└── [message_id]/         # Individual messages"
            echo "    ├── message.json      # Message metadata"
            echo "    ├── message.txt       # Message text"
            echo "    └── media files       # Downloaded media"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "*🛠️ Created by [avasam.ir](https://avasam.ir)*"
          } > "$BACKUP_DIR/$FOLDER_NAME/README.md"
          
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          
          echo ""
          echo "✅ Split archive created (${LINK_NUM} parts, ${TOTAL_ARCHIVE_SIZE_MB}MB total)"

      - name: Copy to downloads and update READMEs
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          
          # Create downloads directory
          mkdir -p downloads
          
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            # Copy new files
            cp -r "$BACKUP_DIR"/* downloads/
            echo "✅ Copied archive to downloads folder"
            echo "Contents of downloads:"
            ls -la downloads/
          else
            echo "❌ Backup directory is empty!"
            exit 1
          fi
          
          # Get ALL folders from downloads
          FOLDERS=$(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          DATE=$(date '+%Y-%m-%d')
          
          # Generate downloads/README.md
          cat > downloads/README.md << 'EOF'
          # 📥 Downloads from Telegram
          
          This folder contains exported channels and downloaded posts from Telegram.
          
          ---
          
          ## 📁 Available Downloads
          
          | # | Item | Type | Size | Date |
          |---|------|------|------|------|
          EOF
          
          COUNTER=1
          for FOLDER in $FOLDERS; do
            if [ -n "$FOLDER" ]; then
              FOLDER_ENCODED=$(urlencode "${FOLDER}")
              SIZE="Unknown"
              TYPE="Channel Export"
              
              if [[ "$FOLDER" == *_channel_export ]]; then
                TYPE="Channel Export"
              else
                TYPE="Single Post"
              fi
              
              if [ -f "downloads/$FOLDER/README.md" ]; then
                SIZE_LINE=$(grep "Total Size" "downloads/$FOLDER/README.md" | head -1)
                if [[ "$SIZE_LINE" =~ ([0-9.]+)\ MB ]]; then
                  SIZE="${BASH_REMATCH[1]} MB"
                fi
              fi
              
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${TYPE} | ${SIZE} | ${DATE} |" >> downloads/README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          cat >> downloads/README.md << 'EOF'
          
          ---
          
          ## 📖 How to use
          
          ### For Channel Exports:
          1. Download all parts of the zip file
          2. Extract the first part (.zip) to get the complete folder
          3. Open `index.html` in your browser to browse all messages
          
          ### For Single Posts:
          1. Click on the post folder above
          2. Download the zip file
          3. Extract to get all files
          
          ---
          
          *🛠️ Created by [avasam.ir](https://avasam.ir)*
          EOF
          
          echo "✅ downloads/README.md updated with $((COUNTER - 1)) item(s)"
          
          # Update root README.md
          ROOT_README="README.md"
          SECTION_TITLE="📥 دانلود‌های تلگرام"
          
          if [ ! -f "$ROOT_README" ]; then
            echo "# AVASAM Telegram Downloader" > "$ROOT_README"
            echo "" >> "$ROOT_README"
            echo "دانلود خودکار کانال‌ها و پست‌های تلگرام و آپلود در گیت‌هاب" >> "$ROOT_README"
            echo "" >> "$ROOT_README"
            echo "---" >> "$ROOT_README"
            echo "" >> "$ROOT_README"
          fi
          
          # Remove old section if exists
          if grep -q "$SECTION_TITLE" "$ROOT_README"; then
            sed -i "/$SECTION_TITLE/,/^---$/d" "$ROOT_README"
            sed -i '${/^$/d;}' "$ROOT_README"
          fi
          
          {
            echo ""
            echo "---"
            echo ""
            echo "## $SECTION_TITLE"
            echo ""
            echo "| # | Item | Type | Size | Date |"
            echo "|---|------|------|------|------|"
          } >> "$ROOT_README"
          
          COUNTER=1
          for FOLDER in $FOLDERS; do
            if [ -n "$FOLDER" ]; then
              FOLDER_ENCODED=$(urlencode "${FOLDER}")
              SIZE="Unknown"
              TYPE="Channel Export"
              
              if [[ "$FOLDER" == *_channel_export ]]; then
                TYPE="Channel Export"
              else
                TYPE="Single Post"
              fi
              
              if [ -f "downloads/$FOLDER/README.md" ]; then
                SIZE_LINE=$(grep "Total Size" "downloads/$FOLDER/README.md" | head -1)
                if [[ "$SIZE_LINE" =~ ([0-9.]+)\ MB ]]; then
                  SIZE="${BASH_REMATCH[1]} MB"
                fi
              fi
              
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${TYPE} | ${SIZE} | ${DATE} |" >> "$ROOT_README"
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          {
            echo ""
            echo "---"
          } >> "$ROOT_README"
          
          echo "✅ Root README.md updated"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          # Ensure downloads directory exists
          mkdir -p downloads
          
          # Add all files
          git add -f downloads/
          git add README.md
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Export channel - $TIMESTAMP [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if timeout 300 git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retry $i/5..."
                if [ $i -lt 5 ]; then
                  sleep 10
                  git pull --rebase origin "$BRANCH" 2>/dev/null || true
                  git add -f downloads/
                  git add README.md
                  if ! git diff --cached --quiet; then
                    git commit -m "Export channel - $TIMESTAMP [skip ci]"
                  fi
                fi
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Channel export completed successfully!"
          echo "=========================================="
