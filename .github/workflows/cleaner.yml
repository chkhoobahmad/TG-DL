name: 🧹 Cleanup Repository

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clean everything
        run: |
          echo "🧹 Starting cleanup..."
          
          # حذف پوشه downloads
          rm -rf downloads
          echo "✅ Removed downloads folder"
          
          # حذف فایل‌های موقت
          rm -rf /tmp/telegram_downloads
          rm -f /tmp/all_post_dirs.txt
          rm -f /tmp/backup_dir_path.txt
          echo "✅ Removed temp files"
          
          # حذف فایل‌های زیپ در ریشه
          rm -f *.zip
          rm -f *.z[0-9]*
          echo "✅ Removed zip files"
          
          # بازنشانی README
          echo "# Telegram Downloader" > README.md
          echo "" >> README.md
          echo "دانلود خودکار پست‌های تلگرام" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "Created by avasam.ir" >> README.md
          echo "✅ Reset README.md"
          
          echo "🧹 Cleanup completed!"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "🧹 Cleanup repository [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "✅ Push successful!"
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Cleanup completed successfully!"
          echo "=========================================="
