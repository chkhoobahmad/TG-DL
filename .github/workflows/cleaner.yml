name: 🧹 Clean All Files

on:
  workflow_dispatch:

jobs:
  clean-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Remove all downloaded files
        run: |
          echo "🧹 Removing all downloaded files..."
          
          # حذف تمام پوشه‌های داخل downloads
          if [ -d "downloads" ]; then
            for folder in downloads/*/; do
              if [ -d "$folder" ]; then
                git rm -rf "$folder"
              fi
            done
          fi
          
          # بازنشانی فایل README
          echo "# Downloads" > downloads/README.md
          echo "" >> downloads/README.md
          echo "No files available." >> downloads/README.md

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Clean all files [skip ci]" || echo "No changes"
          git push origin HEAD:"${GITHUB_REF_NAME}" || true
          
      - name: Done
        run: echo "✅ All files cleaned!"
