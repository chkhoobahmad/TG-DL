name: 🧹 Clean All Files

on:
  workflow_dispatch:

jobs:
  clean-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Clean downloads folder completely
        run: |
          echo "🧹 Cleaning downloads folder..."
          
          # اطمینان از وجود پوشه downloads
          mkdir -p downloads
          
          # حذف تمام فایل‌ها و پوشه‌های داخل downloads
          rm -rf downloads/*
          
          # حذف فایل‌های مخفی داخل downloads (اگر وجود داشته باشند)
          shopt -s dotglob nullglob
          rm -rf downloads/.* 2>/dev/null || true
          
          echo "✅ Downloads folder is now empty"
          ls -la downloads/

      - name: Commit and push
        run: |
          git add downloads/
          git commit -m "Clean all files from downloads folder [skip ci]" || echo "No changes to commit"
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Done
        run: |
          echo "🎉 All files cleaned successfully!"
          echo "📁 Downloads folder exists but is empty"
