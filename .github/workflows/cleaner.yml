name: 🧹 Cleanup Repository

on:
  workflow_dispatch:
    inputs:
      clean_mode:
        description: '🧹 حالت پاکسازی'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - downloads_only
          - temp_files_only
          - keep_last_5
          - keep_last_10
      confirm:
        description: '✅ برای تایید حذف "YES" را وارد کنید'
        required: true
        type: string
        default: 'NO'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "❌ Operation cancelled. Please enter 'YES' to confirm deletion."
            exit 1
          fi
          echo "✅ Confirmation received. Starting cleanup..."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Cleanup Mode: all
        if: github.event.inputs.clean_mode == 'all'
        run: |
          echo "🧹 Cleaning ALL downloads and temporary files..."
          rm -rf downloads
          rm -rf /tmp/telegram_downloads
          rm -f /tmp/all_post_dirs.txt
          rm -f /tmp/backup_dir_path.txt
          rm -f *.zip
          rm -f *.z[0-9]*
          echo "# 📥 Telegram Downloader" > README.md
          echo "" >> README.md
          echo "دانلود خودکار پست‌های تلگرام" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          echo "✅ Cleanup completed"

      - name: Cleanup Mode: downloads_only
        if: github.event.inputs.clean_mode == 'downloads_only'
        run: |
          echo "🧹 Cleaning downloads folder only..."
          rm -rf downloads
          echo "# 📥 Telegram Downloader" > README.md
          echo "" >> README.md
          echo "دانلود خودکار پست‌های تلگرام" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          echo "✅ Cleanup completed"

      - name: Cleanup Mode: temp_files_only
        if: github.event.inputs.clean_mode == 'temp_files_only'
        run: |
          echo "🧹 Cleaning temporary files only..."
          rm -rf /tmp/telegram_downloads
          rm -f /tmp/all_post_dirs.txt
          rm -f /tmp/backup_dir_path.txt
          rm -f *.zip
          rm -f *.z[0-9]*
          echo "✅ Cleanup completed"

      - name: Cleanup Mode: keep_last_5
        if: github.event.inputs.clean_mode == 'keep_last_5'
        run: |
          echo "🧹 Keeping only last 5 downloads..."
          if [ -d "downloads" ]; then
            TOTAL=$(ls -1 downloads/ | wc -l)
            echo "Total folders: $TOTAL"
            if [ $TOTAL -gt 5 ]; then
              TO_DELETE=$((TOTAL - 5))
              ls -1t downloads/ | tail -$TO_DELETE | while read folder; do
                echo "  🗑️ Removing: $folder"
                rm -rf "downloads/$folder"
              done
            else
              echo "Total folders ($TOTAL) is 5 or less, nothing to delete"
            fi
          else
            echo "downloads folder not found"
          fi

      - name: Cleanup Mode: keep_last_10
        if: github.event.inputs.clean_mode == 'keep_last_10'
        run: |
          echo "🧹 Keeping only last 10 downloads..."
          if [ -d "downloads" ]; then
            TOTAL=$(ls -1 downloads/ | wc -l)
            echo "Total folders: $TOTAL"
            if [ $TOTAL -gt 10 ]; then
              TO_DELETE=$((TOTAL - 10))
              ls -1t downloads/ | tail -$TO_DELETE | while read folder; do
                echo "  🗑️ Removing: $folder"
                rm -rf "downloads/$folder"
              done
            else
              echo "Total folders ($TOTAL) is 10 or less, nothing to delete"
            fi
          else
            echo "downloads folder not found"
          fi

      - name: Update README after cleanup
        run: |
          echo "# 📥 Telegram Downloader" > README.md
          echo "" >> README.md
          echo "دانلود خودکار پست‌های تلگرام" >> README.md
          echo "" >> README.md
          if [ -d "downloads" ] && [ "$(ls -A downloads 2>/dev/null)" ]; then
            echo "## 📁 Downloads" >> README.md
            echo "" >> README.md
            COUNTER=1
            for DIR in downloads/*; do
              if [ -d "$DIR" ]; then
                FOLDER_NAME=$(basename "$DIR")
                SIZE=$(du -sh "$DIR" 2>/dev/null | cut -f1)
                echo "${COUNTER}. [${FOLDER_NAME}](./downloads/${FOLDER_NAME}/) - ${SIZE}" >> README.md
                COUNTER=$((COUNTER + 1))
              fi
            done
          fi
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          echo "✅ README.md updated"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            MODE="${{ github.event.inputs.clean_mode }}"
            git commit -m "🧹 Cleanup: $MODE - $TIMESTAMP [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "✅ Push successful!"
          else
            echo "No changes to commit"
          fi
          echo ""
          echo "=========================================="
          echo "✅ Cleanup completed successfully!"
          echo "=========================================="
