name: ⬇️ Download Telegram Posts (Sequential)

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (هر لینک در یک خط)'
        required: true
        type: string
        placeholder: |
          https://t.me/username/123
          https://t.me/username/456
          https://t.me/username/789

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      posts: ${{ steps.set-posts.outputs.posts }}
    steps:
      - id: set-posts
        run: |
          POSTS=$(echo '${{ github.event.inputs.post_urls }}' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "posts=${POSTS}" >> $GITHUB_OUTPUT
          echo "📌 Posts to process: ${POSTS}"

  process-post:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        post_url: ${{ fromJson(needs.prepare.outputs.posts) }}
    
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "🧹 Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          echo ""
          echo "📊 Available disk space:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available!"
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          lfs: false

      - name: Remove Git LFS tracking
        run: |
          git lfs uninstall 2>/dev/null || true
          rm -f .gitattributes
          git config --local --unset-all filter.lfs.process 2>/dev/null || true
          git config --local --unset-all filter.lfs.smudge 2>/dev/null || true
          git config --local --unset-all filter.lfs.clean 2>/dev/null || true
          git config --global filter.lfs.smudge ""
          git config --global filter.lfs.clean ""
          echo "✅ Git LFS disabled"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3 aria2

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Git configured"

      - name: Download from Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          POST_URL: ${{ matrix.post_url }}
        run: |
          if [ ! -f "download_telegram.js" ]; then
            echo "❌ download_telegram.js not found!"
            exit 1
          fi
          
          sudo rm -rf /tmp/telegram_downloads
          mkdir -p /tmp/telegram_downloads
          
          export POST_URLS="${{ matrix.post_url }}"
          node download_telegram.js
          
          if [ $? -eq 0 ] && [ -f "/tmp/all_post_dirs.txt" ] && [ -s "/tmp/all_post_dirs.txt" ]; then
            echo "✅ Download completed!"
            cat /tmp/all_post_dirs.txt
          else
            echo "❌ Download failed!"
            exit 1
          fi

      - name: Process and create split ZIP archive
        run: |
          SPLIT_THRESHOLD_MB=45
          
          echo "=== Contents of /tmp/all_post_dirs.txt ==="
          cat /tmp/all_post_dirs.txt
          echo "==========================================="
          
          while IFS= read -r POST_DIR; do
            POST_DIR=$(echo "$POST_DIR" | xargs)
            if [ -z "$POST_DIR" ]; then
              continue
            fi
            if [ ! -d "$POST_DIR" ]; then
              echo "⚠️ Directory not found: $POST_DIR"
              continue
            fi
            
            FOLDER_NAME=$(basename "$POST_DIR")
            mkdir -p "$FOLDER_NAME"
            
            echo "Processing: $FOLDER_NAME"
            echo "Source: $POST_DIR"
            echo "Target: $FOLDER_NAME"
            
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ]; then
                FILENAME=$(basename "$FILE")
                if [[ "$FILENAME" != "post_info.json" ]] && [[ "$FILENAME" != "message_text.txt" ]] && [[ "$FILENAME" != "no_media.txt" ]] && [[ "$FILENAME" != "temp_download" ]]; then
                  if [ -s "$FILE" ]; then
                    FILE_SIZE=$(stat -c%s "$FILE")
                    FILE_SIZE_MB=$(( FILE_SIZE / 1024 / 1024 ))
                    echo "  Processing: $FILENAME (${FILE_SIZE_MB}MB)"
                    
                    cp "$FILE" "$FOLDER_NAME/$FILENAME"
                    
                    cd "$FOLDER_NAME"
                    
                    if [ "$FILE_SIZE" -gt $(( SPLIT_THRESHOLD_MB * 1024 * 1024 )) ]; then
                      echo "    Splitting into ${SPLIT_THRESHOLD_MB}MB parts..."
                      zip -s ${SPLIT_THRESHOLD_MB}m "${FILENAME%.*}.zip" "$FILENAME"
                      if [ $? -eq 0 ]; then
                        rm -f "$FILENAME"
                        PARTS_COUNT=$(ls -1 *.zip *.z[0-9]* 2>/dev/null | wc -l)
                        TOTAL_SIZE=0
                        for PART in *; do
                          [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART" 2>/dev/null || echo 0)))
                        done
                        TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
                        
                        echo "# 📥 ${FOLDER_NAME}" > README.md
                        echo "" >> README.md
                        echo "**Size:** ${TOTAL_SIZE_MB} MB" >> README.md
                        echo "**Parts:** ${PARTS_COUNT}" >> README.md
                        echo "" >> README.md
                        echo "## Download" >> README.md
                        echo "Download all parts (.z01, .z02, ..., .zip) and extract the .zip file." >> README.md
                        echo "" >> README.md
                        echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
                        echo "    ✅ Created ${PARTS_COUNT} parts (${TOTAL_SIZE_MB}MB)"
                      else
                        echo "    ❌ Zip failed"
                      fi
                    else
                      echo "    Creating single zip..."
                      zip "${FILENAME%.*}.zip" "$FILENAME"
                      if [ $? -eq 0 ]; then
                        rm -f "$FILENAME"
                        SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1024 / 1024" | bc)
                        
                        echo "# 📥 ${FOLDER_NAME}" > README.md
                        echo "" >> README.md
                        echo "**Size:** ${SIZE_MB} MB" >> README.md
                        echo "" >> README.md
                        echo "## Download" >> README.md
                        echo "Download ${FILENAME%.*}.zip and extract." >> README.md
                        echo "" >> README.md
                        echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
                        echo "    ✅ Created zip (${SIZE_MB}MB)"
                      else
                        echo "    ❌ Zip failed"
                      fi
                    fi
                    
                    cd - > /dev/null
                  fi
                fi
              fi
            done
          done < /tmp/all_post_dirs.txt
          
          echo ""
          echo "=== Processed folder contents ==="
          ls -la
          for DIR in */; do
            if [ -d "$DIR" ]; then
              echo "Contents of $(basename "$DIR"):"
              ls -la "$DIR"
            fi
          done

      - name: Commit and push to repository
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          # Find the processed folder
          PROCESSED_FOLDER=""
          while IFS= read -r POST_DIR; do
            POST_DIR=$(echo "$POST_DIR" | xargs)
            if [ -n "$POST_DIR" ] && [ -d "$(basename "$POST_DIR")" ]; then
              PROCESSED_FOLDER="$(basename "$POST_DIR")"
              break
            fi
          done < /tmp/all_post_dirs.txt
          
          if [ -z "$PROCESSED_FOLDER" ] || [ ! -d "$PROCESSED_FOLDER" ]; then
            echo "❌ No folder to commit!"
            exit 1
          fi
          
          echo "📁 Committing: $PROCESSED_FOLDER"
          
          # Create downloads directory if not exists
          mkdir -p downloads
          
          # Remove old folder if exists and copy new one
          rm -rf "downloads/$PROCESSED_FOLDER"
          cp -r "$PROCESSED_FOLDER" "downloads/$PROCESSED_FOLDER"
          
          # Update root README
          echo "# 📥 Telegram Downloader" > README.md
          echo "" >> README.md
          echo "دانلود خودکار پست‌های تلگرام" >> README.md
          echo "" >> README.md
          echo "## 📁 Downloads" >> README.md
          echo "" >> README.md
          echo "| # | Post | Size |" >> README.md
          echo "|---|------|------|" >> README.md
          
          COUNTER=1
          for DIR in downloads/*/; do
            if [ -d "$DIR" ]; then
              FOLDER_NAME=$(basename "$DIR")
              SIZE=$(du -sh "$DIR" 2>/dev/null | cut -f1)
              echo "| ${COUNTER} | [${FOLDER_NAME}](./downloads/${FOLDER_NAME}/) | ${SIZE} |" >> README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          
          # Commit and push
          git add -f downloads/
          git add README.md
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Add: $PROCESSED_FOLDER - $TIMESTAMP [skip ci]"
            
            for i in 1 2 3 4 5; do
              echo "Push attempt $i/5..."
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Post $PROCESSED_FOLDER completed!"
          echo "=========================================="

      - name: Cleanup for next iteration
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          # Remove processed folder
          while IFS= read -r POST_DIR; do
            POST_DIR=$(echo "$POST_DIR" | xargs)
            if [ -n "$POST_DIR" ]; then
              FOLDER_NAME=$(basename "$POST_DIR")
              rm -rf "$FOLDER_NAME"
            fi
          done < /tmp/all_post_dirs.txt
          
          # Clean temp directories
          sudo rm -rf /tmp/telegram_downloads
          sudo rm -rf /tmp/download_backup_*
          sudo rm -rf /tmp/zip_temp_*
          
          echo "✅ Cleanup completed"
