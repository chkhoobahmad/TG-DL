name: ⬇️ Download Telegram Posts

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (هر لینک در یک خط)'
        required: true
        type: string
        placeholder: |
          https://t.me/username/123
          https://t.me/username/456
      mode:
        description: '📦 حالت دانلود'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      password:
        description: '🔒 رمز عبور برای فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  save-file:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          
          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          lfs: false

      - name: Remove Git LFS tracking
        run: |
          git lfs uninstall 2>/dev/null || true
          rm -f .gitattributes
          git config --local --unset-all filter.lfs.process 2>/dev/null || true
          git config --local --unset-all filter.lfs.smudge 2>/dev/null || true
          git config --local --unset-all filter.lfs.clean 2>/dev/null || true
          git config --global filter.lfs.smudge ""
          git config --global filter.lfs.clean ""
          echo "✅ Git LFS disabled"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3 aria2

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          echo "Git configured"

      - name: Download from Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          if [ ! -f "download_telegram.js" ]; then
            echo "❌ download_telegram.js not found in repository!"
            exit 1
          fi
          
          sudo rm -rf /tmp/telegram_downloads
          mkdir -p /tmp/telegram_downloads
          
          echo "${{ github.event.inputs.post_urls }}" | while IFS= read -r URL; do
            if [ -z "$URL" ]; then
              continue
            fi
            
            echo ""
            echo "=========================================="
            echo "📥 Downloading: $URL"
            echo "=========================================="
            
            export POST_URL="$URL"
            export OUTPUT_FILE="/tmp/downloaded_post_dir_$$.txt"
            node download_telegram.js
            
            if [ $? -eq 0 ] && [ -f "$OUTPUT_FILE" ]; then
              cat "$OUTPUT_FILE" >> /tmp/all_post_dirs.txt
              echo "" >> /tmp/all_post_dirs.txt
              echo "✅ Download successful"
            else
              echo "❌ Download failed for: $URL"
            fi
          done
          
          if [ ! -f "/tmp/all_post_dirs.txt" ] || [ ! -s "/tmp/all_post_dirs.txt" ]; then
            echo "❌ No posts were downloaded!"
            exit 1
          fi
          
          echo "✅ All downloads completed!"
          cat /tmp/all_post_dirs.txt

      - name: Download and process files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"

          SPLIT_THRESHOLD_MB=45
          SPLIT_THRESHOLD_BYTES=$(( SPLIT_THRESHOLD_MB * 1024 * 1024 ))

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt

          mkdir -p tmp_downloads

          cleanup_temp_files() {
            rm -f tmp_downloads/*.aria2 2>/dev/null
            rm -f tmp_downloads/*.part 2>/dev/null
            sync
          }

          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            echo "${NAME}_$(date +%s)_$RANDOM"
          }

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          # کپی فایل‌های دانلود شده
          echo "Copying downloaded files from Telegram..."
          while IFS= read -r POST_DIR; do
            if [ -z "$POST_DIR" ] || [ ! -d "$POST_DIR" ]; then
              continue
            fi
            
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                BASENAME=$(basename "$FILE")
                cp "$FILE" "tmp_downloads/$BASENAME"
                echo "  Copied: $BASENAME ($(du -h "$FILE" | cut -f1))"
              fi
            done
          done < /tmp/all_post_dirs.txt

          # پردازش فایل‌ها
          for FILE in tmp_downloads/*; do
            [ -f "$FILE" ] || continue

            if [ ! -s "$FILE" ]; then
              echo "WARNING: Skipping empty file: $FILE"
              rm -f "$FILE"
              continue
            fi

            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            BASENAME_NO_EXT="${BASENAME%.*}"
            
            FOLDER_NAME=$(get_unique_folder "$BACKUP_DIR" "$BASENAME_NO_EXT")
            TARGET_DIR="$BACKUP_DIR/$FOLDER_NAME"
            mkdir -p "$TARGET_DIR"

            if [ "$SIZE" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
              echo "$BASENAME is $(( SIZE / 1024 / 1024 ))MB - splitting into ${SPLIT_THRESHOLD_MB}MB parts"

              cd "$TARGET_DIR"
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -0 -P "${ZIP_PASSWORD}" -s ${SPLIT_THRESHOLD_MB}m "${BASENAME_NO_EXT}.zip" "$FILE"
              else
                zip -0 -s ${SPLIT_THRESHOLD_MB}m "${BASENAME_NO_EXT}.zip" "$FILE"
              fi
              cd - > /dev/null
              
              rm -f "$FILE"
              
              PARTS_COUNT=$(ls -1 "$TARGET_DIR"/*.zip "$TARGET_DIR"/*.z[0-9]* 2>/dev/null | wc -l)
              
              # محاسبه حجم کل
              TOTAL_SIZE=0
              for PART in "$TARGET_DIR"/*; do
                [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART" 2>/dev/null || echo 0)))
              done
              TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)

              # ایجاد README
              cat > "$TARGET_DIR/README.md" << EOF
# 📥 ${BASENAME_NO_EXT}

**Size:** ${TOTAL_SIZE_MB} MB  
**Parts:** ${PARTS_COUNT}  
**Status:** ✅ Complete

---

## 📦 Download Links

| Part | File |
|------|------|
EOF
              for PART in $(ls -1 "$TARGET_DIR"/*.zip "$TARGET_DIR"/*.z[0-9]* 2>/dev/null | sort); do
                PART_NAME=$(basename "$PART")
                echo "| ${PART_NAME##*.} | \`${PART_NAME}\` |" >> "$TARGET_DIR/README.md"
              done

              cat >> "$TARGET_DIR/README.md" << 'EOF'

---

## 📖 How to Extract

1. **Download ALL parts** to the same folder
2. **Extract** the `.zip` file

*Created by [avasam.ir](https://avasam.ir)*
EOF
              echo "  ✅ Created ${PARTS_COUNT} part(s) (${TOTAL_SIZE_MB}MB total)"

            else
              echo "$BASENAME - creating zip archive"
              
              cd "$TARGET_DIR"
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -0 -P "${ZIP_PASSWORD}" "${BASENAME_NO_EXT}.zip" "$FILE"
              else
                zip -0 "${BASENAME_NO_EXT}.zip" "$FILE"
              fi
              cd - > /dev/null
              
              rm -f "$FILE"
              SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
              
              cat > "$TARGET_DIR/README.md" << EOF
# 📥 ${BASENAME_NO_EXT}

**Size:** ${SIZE_MB} MB  
**Status:** ✅ Complete

---

## 📦 Download

\`${BASENAME_NO_EXT}.zip\`

---

## 📖 How to Extract

1. **Download** the zip file
2. **Extract** with any archive tool

*Created by [avasam.ir](https://avasam.ir)*
EOF
              echo "  ✅ Created zip archive (${SIZE_MB}MB)"
            fi
          done
          
          rm -rf tmp_downloads
          cleanup_temp_files
          
          echo ""
          echo "===== Backup folder contents ====="
          ls -la "$BACKUP_DIR"

      - name: Copy to downloads folder and create README
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          
          # حذف پوشه downloads قدیمی
          rm -rf downloads
          mkdir -p downloads
          
          # کپی فایل‌ها به پوشه downloads
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            for FOLDER in "$BACKUP_DIR"/*; do
              if [ -d "$FOLDER" ]; then
                FOLDER_NAME=$(basename "$FOLDER")
                cp -r "$FOLDER" "downloads/$FOLDER_NAME"
                echo "✅ Copied: $FOLDER_NAME"
              fi
            done
          fi
          
          # نمایش ساختار نهایی
          echo ""
          echo "📁 Final downloads structure:"
          ls -la downloads/
          for DIR in downloads/*/; do
            echo "  Contents of $(basename "$DIR"):"
            ls -la "$DIR"
          done

      - name: Update root README
        run: |
          echo "📝 Updating root README..."
          
          cat > README.md << 'EOF'
          # 📥 Telegram Downloader
          
          دانلود خودکار پست‌های تلگرام و ذخیره در گیت‌هاب
          
          ---
          
          ## 📁 دانلودهای موجود
          
          EOF
          
          for FOLDER in downloads/*/; do
            if [ -d "$FOLDER" ]; then
              FOLDER_NAME=$(basename "$FOLDER")
              ZIP_COUNT=$(ls -1 "$FOLDER"/*.zip 2>/dev/null | wc -l)
              PART_COUNT=$(ls -1 "$FOLDER"/*.z* 2>/dev/null | wc -l)
              TOTAL_PARTS=$((ZIP_COUNT + PART_COUNT))
              
              if [ $TOTAL_PARTS -gt 0 ]; then
                SIZE=$(du -sh "$FOLDER" 2>/dev/null | cut -f1)
                echo "- **${FOLDER_NAME}** - ${SIZE} - [مشاهده](./${FOLDER}/)" >> README.md
              fi
            fi
          done
          
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          
          echo "✅ README.md updated"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi
          
          # نمایش فایل‌هایی که قرار است commit شوند
          echo "Files to commit:"
          find downloads -type f | head -20
          
          git add -f downloads/
          git add README.md
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "📁 Files are in the 'downloads' folder"
          echo "=========================================="
