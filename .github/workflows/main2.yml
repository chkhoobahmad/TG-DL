name: ⬇️ Download Telegram Posts with Split ZIP

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (با فاصله یا خط جدید جدا کنید)'
        required: true
        type: string
        placeholder: |
          https://t.me/username/123
          https://t.me/username/456
      zip_password:
        description: '🔒 رمز عبور برای فایل زیپ (اختیاری)'
        required: false
        type: string
        default: ''

jobs:
  download-telegram-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    
    steps:
      - name: 🧹 Cleanup disk space
        run: |
          echo "🧹 Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo rm -rf /opt/az /opt/microsoft /usr/lib/jvm /usr/local/go
          sudo docker system prune -a -f 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /tmp/* /var/tmp/*
          rm -rf ~/.cache ~/.npm ~/.cargo
          
          echo "📊 Available disk space:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram@2.0.7
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global http.postBuffer 524288000

      - name: Download posts from Telegram
        id: download
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          POST_URLS: ${{ github.event.inputs.post_urls }}
        run: |
          cat > download_telegram.js << 'EOF'
          const { TelegramClient } = require("telegram");
          const { StringSession } = require("telegram/sessions");
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const apiId = parseInt(process.env.API_ID);
          const apiHash = process.env.API_HASH;
          const stringSession = process.env.STRING_SESSION;
          
          // Parse URLs (split by newline or space)
          const postUrls = process.env.POST_URLS
            .split(/\s+/)
            .filter(url => url.trim() && url.startsWith('http'));
          
          console.log(`📌 Total posts to download: ${postUrls.length}`);
          console.log(`📌 URLs: ${postUrls.join(', ')}`);

          function sanitizeFilename(filename) {
            return filename.replace(/[<>:"|?*\\/]/g, '_').replace(/\s+/g, '_');
          }

          async function extractChatAndMsgId(url) {
            const patterns = [
              /https?:\/\/t\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
              /https?:\/\/telegram\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
            ];
            
            let match = null;
            for (const pattern of patterns) {
              match = url.match(pattern);
              if (match) break;
            }
            
            if (!match) {
              throw new Error(`Invalid URL: ${url}`);
            }
            
            let chatId = match[1];
            const msgId = parseInt(match[2]);
            
            if (chatId === 'c' || chatId.startsWith('c/')) {
              chatId = '-100' + chatId.replace('c/', '').replace('c', '');
            } else if (!isNaN(parseInt(chatId)) && chatId.length > 5) {
              chatId = '-100' + chatId;
            }
            
            return { chatId, msgId };
          }

          async function downloadMediaFile(client, media, outputPath, fileName) {
            return new Promise(async (resolve, reject) => {
              try {
                let lastPercent = 0;
                const filePath = await client.downloadMedia(media, {
                  outputFile: outputPath,
                  progressCallback: (downloaded, total) => {
                    const percent = (downloaded / total * 100);
                    if (Math.floor(percent / 10) > Math.floor(lastPercent / 10)) {
                      lastPercent = percent;
                      console.log(`      📊 ${percent.toFixed(0)}% (${(downloaded/1024/1024).toFixed(1)}MB / ${(total/1024/1024).toFixed(1)}MB)`);
                    }
                  }
                });
                
                if (filePath && fs.existsSync(filePath) && fs.statSync(filePath).size > 0) {
                  console.log(`   ✅ Downloaded: ${fileName} (${(fs.statSync(filePath).size/1024/1024).toFixed(2)}MB)`);
                  resolve(filePath);
                } else {
                  reject(new Error("Download failed or file empty"));
                }
              } catch (err) {
                reject(err);
              }
            });
          }

          async function downloadPost(client, postUrl, index, total) {
            console.log(`\n${'='.repeat(50)}`);
            console.log(`📌 [${index+1}/${total}] Processing: ${postUrl}`);
            console.log(`${'='.repeat(50)}`);
            
            const { chatId, msgId } = await extractChatAndMsgId(postUrl);
            
            // Get chat entity
            let chat;
            if (chatId.toString().startsWith('-100')) {
              chat = await client.getEntity(parseInt(chatId));
            } else {
              chat = await client.getEntity(chatId);
            }
            
            // Get channel name
            let channelName = chat.username || chat.title || chatId.toString().replace('-100', '');
            channelName = sanitizeFilename(channelName);
            
            // Get message
            const messages = await client.getMessages(chat, { ids: msgId });
            const message = messages[0];
            
            if (!message) {
              throw new Error(`Message ${msgId} not found`);
            }
            
            console.log(`✅ Channel: ${channelName}`);
            console.log(`✅ Message found! Date: ${new Date(message.date * 1000).toISOString()}`);
            
            // Create directory for this post
            const postDir = `/tmp/telegram_downloads/${channelName}/${msgId}`;
            fs.mkdirSync(postDir, { recursive: true });
            
            const downloadedFiles = [];
            
            // Save message text
            if (message.text && message.text.length > 0) {
              const textFile = path.join(postDir, 'message_text.txt');
              fs.writeFileSync(textFile, message.text);
              downloadedFiles.push(textFile);
              console.log(`📝 Saved text (${message.text.length} chars)`);
            }
            
            // Download media
            if (message.media) {
              console.log(`📥 Downloading media...`);
              
              // Get filename from media or generate one
              let fileName = null;
              if (message.media.document && message.media.document.attributes) {
                for (const attr of message.media.document.attributes) {
                  if (attr.className === 'DocumentAttributeFilename') {
                    fileName = sanitizeFilename(attr.fileName);
                    break;
                  }
                }
              }
              
              if (!fileName) {
                const mediaType = message.media.className;
                if (mediaType === 'MessageMediaPhoto') {
                  fileName = `photo_${Date.now()}.jpg`;
                } else if (mediaType === 'MessageMediaDocument') {
                  fileName = `document_${Date.now()}`;
                } else {
                  fileName = `media_${Date.now()}`;
                }
              }
              
              const tempPath = path.join(postDir, 'temp_download');
              
              try {
                await downloadMediaFile(client, message.media, tempPath, fileName);
                
                if (fs.existsSync(tempPath) && fs.statSync(tempPath).size > 0) {
                  // Detect file type
                  const fileType = execSync(`file --mime-type -b "${tempPath}"`).toString().trim();
                  const extMap = {
                    'video/mp4': '.mp4', 'video/x-matroska': '.mkv', 'video/webm': '.webm',
                    'video/quicktime': '.mov', 'video/x-msvideo': '.avi',
                    'audio/mpeg': '.mp3', 'audio/mp4': '.m4a', 'audio/ogg': '.ogg',
                    'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif',
                    'image/webp': '.webp',
                    'application/pdf': '.pdf', 'application/zip': '.zip',
                    'application/x-rar': '.rar', 'application/x-7z-compressed': '.7z'
                  };
                  const ext = extMap[fileType] || '';
                  
                  let finalFileName = fileName;
                  if (!fileName.includes('.') && ext) {
                    finalFileName = fileName + ext;
                  }
                  
                  const finalPath = path.join(postDir, finalFileName);
                  fs.renameSync(tempPath, finalPath);
                  downloadedFiles.push(finalPath);
                  console.log(`   ✅ Saved as: ${finalFileName}`);
                }
              } catch (err) {
                console.error(`   ❌ Download error: ${err.message}`);
              }
            } else {
              console.log(`⚠️ No media in this post`);
            }
            
            // Save post info
            const totalSize = downloadedFiles.reduce((sum, f) => {
              try { return sum + fs.statSync(f).size; } catch { return sum; }
            }, 0);
            
            const infoFile = path.join(postDir, 'post_info.json');
            fs.writeFileSync(infoFile, JSON.stringify({
              url: postUrl,
              channel: channelName,
              postId: msgId,
              date: message.date,
              files: downloadedFiles.map(f => path.basename(f)),
              totalSizeMB: (totalSize / 1024 / 1024).toFixed(2),
              hasMedia: !!message.media,
              hasText: !!(message.text && message.text.length > 0)
            }, null, 2));
            downloadedFiles.push(infoFile);
            
            console.log(`📊 Summary: ${downloadedFiles.length} file(s), ${(totalSize/1024/1024).toFixed(2)}MB`);
            
            return { channel: channelName, postId: msgId, postDir };
          }

          async function main() {
            let client = null;
            const allDirs = [];
            
            try {
              console.log('🚀 Connecting to Telegram API...');
              
              const session = new StringSession(stringSession);
              client = new TelegramClient(session, apiId, apiHash, {
                connectionRetries: 3,
                useWSS: true,
              });
              
              await client.start({
                phoneNumber: () => { throw new Error('Use STRING_SESSION'); },
                phoneCode: () => { throw new Error('Use STRING_SESSION'); },
                password: () => { throw new Error('Use STRING_SESSION'); },
              });
              
              console.log('✅ Connected!\n');
              
              for (let i = 0; i < postUrls.length; i++) {
                const result = await downloadPost(client, postUrls[i], i, postUrls.length);
                allDirs.push(result.postDir);
              }
              
              // Save directories list
              fs.writeFileSync('/tmp/all_post_dirs.txt', allDirs.join('\n'));
              
              console.log(`\n${'='.repeat(50)}`);
              console.log(`✅ Success! Downloaded ${allDirs.length} post(s)`);
              console.log(`${'='.repeat(50)}`);
              
            } catch (error) {
              console.error('❌ Fatal error:', error.message);
              process.exit(1);
            } finally {
              if (client) await client.disconnect();
            }
          }
          
          main().catch(err => {
            console.error('Error:', err.message);
            process.exit(1);
          });
          EOF

          node download_telegram.js
          
          if [ -f "/tmp/all_post_dirs.txt" ] && [ -s "/tmp/all_post_dirs.txt" ]; then
            echo "✅ Download completed!"
            POST_DIRS=$(cat /tmp/all_post_dirs.txt | tr '\n' ' ')
            echo "POST_DIRS=${POST_DIRS}" >> $GITHUB_OUTPUT
          else
            echo "❌ Download failed!"
            exit 1
          fi

      - name: Create split ZIP archives (45MB parts)
        env:
          ZIP_PASSWORD: ${{ github.event.inputs.zip_password }}
        run: |
          echo "📦 Creating split ZIP archives (45MB per part)..."
          
          # Read directories into array
          POST_DIRS=()
          if [ -f "/tmp/all_post_dirs.txt" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && POST_DIRS+=("$line")
            done < /tmp/all_post_dirs.txt
          fi
          
          if [ ${#POST_DIRS[@]} -eq 0 ]; then
            echo "❌ No download directories found!"
            exit 1
          fi
          
          # Create downloads folder
          mkdir -p downloads
          
          SPLIT_SIZE="43m"  # 43MB to ensure under 45MB
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          for POST_DIR in "${POST_DIRS[@]}"; do
            if [ ! -d "$POST_DIR" ]; then
              echo "⚠️ Directory not found: $POST_DIR"
              continue
            fi
            
            CHANNEL_NAME=$(basename "$(dirname "$POST_DIR")")
            POST_ID=$(basename "$POST_DIR")
            FOLDER_NAME="${CHANNEL_NAME}_${POST_ID}"
            TARGET_DIR="downloads/${FOLDER_NAME}"
            
            mkdir -p "$TARGET_DIR"
            
            echo ""
            echo "📁 Processing: $CHANNEL_NAME / $POST_ID"
            echo "   Source: $POST_DIR"
            
            # Count files
            FILE_COUNT=$(find "$POST_DIR" -type f -size +0c 2>/dev/null | wc -l)
            if [ $FILE_COUNT -eq 0 ]; then
              echo "   ⚠️ No valid files found!"
              continue
            fi
            
            # Create temp directory for this post
            TEMP_DIR="/tmp/split_${FOLDER_NAME}"
            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"
            
            # Copy all non-empty files
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                ORIGINAL_NAME=$(basename "$FILE")
                SAFE_NAME=$(echo "$ORIGINAL_NAME" | sed 's/[<>:"|?*]/_/g')
                cp "$FILE" "$TEMP_DIR/$SAFE_NAME"
                echo "   ✅ Added: $SAFE_NAME ($(du -h "$FILE" | cut -f1))"
              fi
            done
            
            # Create split zip
            cd "$TEMP_DIR"
            
            if [ -n "$ZIP_PASSWORD" ]; then
              echo "   🔒 Creating password-protected split ZIP..."
              zip -r -s ${SPLIT_SIZE} -P "${ZIP_PASSWORD}" "${FOLDER_NAME}.zip" ./*
            else
              echo "   📀 Creating split ZIP (${SPLIT_SIZE} parts)..."
              zip -r -s ${SPLIT_SIZE} "${FOLDER_NAME}.zip" ./*
            fi
            
            # Move all parts to target
            mv ${FOLDER_NAME}.z* "$TARGET_DIR/" 2>/dev/null || true
            mv ${FOLDER_NAME}.zip "$TARGET_DIR/" 2>/dev/null || true
            
            cd - > /dev/null
            rm -rf "$TEMP_DIR"
            
            # Count parts
            PART_COUNT=$(ls -1 "$TARGET_DIR"/*.z* 2>/dev/null | wc -l)
            if [ -f "$TARGET_DIR/${FOLDER_NAME}.zip" ]; then
              PART_COUNT=$((PART_COUNT + 1))
            fi
            
            if [ $PART_COUNT -eq 0 ]; then
              echo "   ❌ Failed to create archive!"
              continue
            fi
            
            # Calculate total size
            TOTAL_SIZE=0
            for PART in "$TARGET_DIR"/*; do
              [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART")))
            done
            TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
            
            # Create README.md for this post
            cat > "$TARGET_DIR/README.md" << EOF
# 📥 Telegram Post ${POST_ID}

**Channel:** \`${CHANNEL_NAME}\`  
**Post ID:** ${POST_ID}  
**Total Size:** ${TOTAL_SIZE_MB} MB (${PART_COUNT} part${PART_COUNT > 1 ? 's' : ''})  
**Status:** ✅ Complete

---

## 📦 Download Links

| Part | File | Size |
|------|------|------|
EOF
            
            for PART in $(ls -1 "$TARGET_DIR"/*.{zip,z[0-9]*} 2>/dev/null | sort); do
              PART_NAME=$(basename "$PART")
              PART_SIZE=$(du -h "$PART" | cut -f1)
              PART_ENCODED=$(urlencode "$PART_NAME")
              RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${FOLDER_NAME}/${PART_ENCODED}"
              echo "| ${PART_NAME##*.} | \`${PART_NAME}\` | [Download](${RAW_LINK}) | ${PART_SIZE} |" >> "$TARGET_DIR/README.md"
            done
            
            cat >> "$TARGET_DIR/README.md" << EOF

---

## 📖 How to Extract

1. **Download ALL parts** to the same folder
2. **Extract** the \`.zip\` file:
   - **Windows:** Right-click → Extract All
   - **Linux/Mac:** \`unzip ${FOLDER_NAME}.zip\`
3. **Enter password** if prompted

---

*Created by [avasam.ir](https://avasam.ir)*
EOF
            
            echo "   ✅ Created ${PART_COUNT} part(s) (${TOTAL_SIZE_MB}MB total)"
          done
          
          echo ""
          echo "✅ All split archives created!"

      - name: Generate main README
        run: |
          echo "📝 Generating README files..."
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          
          # Create downloads/README.md
          cat > downloads/README.md << 'EOF'
          # 📥 Telegram Downloads
          
          Posts downloaded from Telegram, split into **45MB ZIP parts**.
          
          ---
          
          ## 📁 Available Downloads
          
          | # | Post | Parts | Size |
          |---|------|-------|------|
          EOF
          
          COUNTER=1
          for FOLDER in $(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort); do
            if [ -n "$FOLDER" ] && [ -f "downloads/$FOLDER/README.md" ]; then
              FOLDER_ENCODED=$(urlencode "$FOLDER")
              PARTS=$(ls -1 downloads/$FOLDER/*.{zip,z[0-9]*} 2>/dev/null | wc -l)
              
              # Get size from README
              SIZE=$(grep "Total Size:" "downloads/$FOLDER/README.md" | head -1 | sed 's/.*Total Size: \([^ ]* MB\).*/\1/' || echo "Unknown")
              
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} part(s) | ${SIZE} |" >> downloads/README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          cat >> downloads/README.md << 'EOF'
          
          ---
          
          ## 📖 How to Extract
          
          1. Click on any post folder above
          2. **Download ALL parts** (.z01, .z02, ..., .zip)
          3. Extract the `.zip` file with any archive tool
          
          *Created by [avasam.ir](https://avasam.ir)*
          EOF
          
          # Update root README
          if [ ! -f "README.md" ]; then
            echo "# AVASAM Telegram Downloader" > README.md
            echo "" >> README.md
            echo "دانلود خودکار پست‌های تلگرام و ذخیره در گیت‌هاب" >> README.md
            echo "" >> README.md
          fi
          
          cat >> README.md << 'EOF'
          
          ---
          
          ## 📥 دانلود‌های تلگرام
          
          EOF
          
          echo "| # | Post | Parts | Size |" >> README.md
          echo "|---|------|-------|------|" >> README.md
          
          COUNTER=1
          for FOLDER in $(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort); do
            if [ -n "$FOLDER" ] && [ -f "downloads/$FOLDER/README.md" ]; then
              FOLDER_ENCODED=$(urlencode "$FOLDER")
              PARTS=$(ls -1 downloads/$FOLDER/*.{zip,z[0-9]*} 2>/dev/null | wc -l)
              SIZE=$(grep "Total Size:" "downloads/$FOLDER/README.md" | head -1 | sed 's/.*Total Size: \([^ ]* MB\).*/\1/' || echo "Unknown")
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} | ${SIZE} |" >> README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          
          echo "✅ README files updated"

      - name: Commit and push to repository
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi
          
          git add -f downloads/
          git add README.md
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "📁 Files are stored directly in the repository"
          echo "📦 Files are split into ~45MB ZIP parts"
          echo "=========================================="
