name: ⬇️ Download Multiple Telegram Posts

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (با فاصله جدا کنید)'
        required: true
        type: string
        placeholder: 'https://t.me/username/123 https://t.me/username/456'

jobs:
  download-from-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          
          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Download Multiple Posts from Telegram
        id: download
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          POST_URLS: ${{ github.event.inputs.post_urls }}
        run: |
          cat > download_telegram.js << 'EOF'
          const { TelegramClient } = require("telegram");
          const { StringSession } = require("telegram/sessions");
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const apiId = parseInt(process.env.API_ID);
          const apiHash = process.env.API_HASH;
          const stringSession = process.env.STRING_SESSION;
          const postUrls = process.env.POST_URLS.split(/\s+/).filter(url => url.trim());

          let lastLoggedPercent = 0;

          function sanitizeFilename(filename) {
            return filename.replace(/[<>:"|?*\\/]/g, '_').replace(/\s+/g, '_');
          }

          async function extractChatAndMsgId(url) {
            const patterns = [
              /https?:\/\/t\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
              /https?:\/\/telegram\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
            ];
            
            let match = null;
            for (const pattern of patterns) {
              match = url.match(pattern);
              if (match) break;
            }
            
            if (!match) {
              throw new Error(`Invalid Telegram post URL format: ${url}`);
            }
            
            let chatId = match[1];
            const msgId = parseInt(match[2]);
            
            if (chatId === 'c' || chatId.startsWith('c/')) {
              chatId = '-100' + chatId.replace('c/', '').replace('c', '');
            } else if (!isNaN(parseInt(chatId)) && chatId.length > 5) {
              chatId = '-100' + chatId;
            }
            
            return { chatId, msgId };
          }

          async function downloadMediaFile(client, media, outputPath, fileName) {
            return new Promise(async (resolve, reject) => {
              try {
                let lastPercent = 0;
                const filePath = await client.downloadMedia(media, {
                  outputFile: outputPath,
                  progressCallback: (downloaded, total) => {
                    const percent = (downloaded / total * 100);
                    if (Math.floor(percent / 5) > Math.floor(lastPercent / 5) || percent === 100) {
                      lastPercent = percent;
                      const downloadedMB = downloaded / 1024 / 1024;
                      const totalMB = total / 1024 / 1024;
                      console.log(`      📊 ${percent.toFixed(1)}% (${downloadedMB.toFixed(2)}MB / ${totalMB.toFixed(2)}MB)`);
                    }
                  }
                });
                
                if (filePath && fs.existsSync(filePath)) {
                  const stats = fs.statSync(filePath);
                  if (stats.size > 0) {
                    console.log(`   ✅ Downloaded: ${fileName} (${(stats.size/1024/1024).toFixed(2)}MB)`);
                    resolve(filePath);
                  } else {
                    reject(new Error("File is empty"));
                  }
                } else {
                  reject(new Error("Download failed"));
                }
              } catch (err) {
                reject(err);
              }
            });
          }

          async function getFileNameFromMedia(media) {
            if (media.document && media.document.attributes) {
              for (const attr of media.document.attributes) {
                if (attr.className === 'DocumentAttributeFilename') {
                  return sanitizeFilename(attr.fileName);
                }
              }
            }
            return null;
          }

          async function downloadPost(client, postUrl, index, total) {
            console.log(`\n${'='.repeat(60)}`);
            console.log(`📌 Downloading post ${index + 1}/${total}: ${postUrl}`);
            console.log(`${'='.repeat(60)}`);
            
            const { chatId, msgId } = await extractChatAndMsgId(postUrl);
            
            let chat;
            if (chatId.toString().startsWith('-100')) {
              chat = await client.getEntity(parseInt(chatId));
            } else {
              chat = await client.getEntity(chatId);
            }
            
            let channelName = "unknown_channel";
            if (chat.username) {
              channelName = chat.username;
            } else if (chat.title) {
              channelName = sanitizeFilename(chat.title);
            } else {
              channelName = chatId.toString().replace('-100', '');
            }
            
            const messages = await client.getMessages(chat, { ids: msgId });
            const message = messages[0];
            
            if (!message) {
              throw new Error(`Message ${msgId} not found in ${channelName}`);
            }
            
            console.log(`✅ Message found!`);
            
            const baseTempDir = `/tmp/telegram_downloads`;
            const channelDir = path.join(baseTempDir, channelName);
            const postDir = path.join(channelDir, String(msgId));
            fs.mkdirSync(postDir, { recursive: true });
            
            console.log(`📁 Channel: ${channelName}`);
            console.log(`📁 Post ID: ${msgId}`);
            console.log(`📁 Save directory: ${postDir}`);
            
            const downloadedFiles = [];
            
            if (message.text && message.text.length > 0) {
              const textFile = path.join(postDir, 'message_text.txt');
              fs.writeFileSync(textFile, message.text);
              downloadedFiles.push(textFile);
              console.log(`📝 Saved message text (${message.text.length} characters)`);
            }
            
            if (message.media) {
              console.log(`📥 Downloading media...`);
              
              let fileName = await getFileNameFromMedia(message.media);
              
              if (!fileName) {
                const mediaType = message.media.className;
                if (mediaType === 'MessageMediaPhoto') {
                  fileName = `photo.jpg`;
                } else if (mediaType === 'MessageMediaDocument') {
                  fileName = `document`;
                } else {
                  fileName = `media`;
                }
              }
              
              let outputPath = path.join(postDir, fileName);
              
              if (!path.extname(outputPath) || path.extname(outputPath) === '') {
                const tempPath = path.join(postDir, `temp_download`);
                try {
                  await downloadMediaFile(client, message.media, tempPath, fileName);
                  
                  if (fs.existsSync(tempPath)) {
                    const fileType = execSync(`file --mime-type -b "${tempPath}"`).toString().trim();
                    const extMap = {
                      'video/mp4': '.mp4', 'video/x-matroska': '.mkv', 'video/webm': '.webm',
                      'video/quicktime': '.mov', 'video/x-msvideo': '.avi',
                      'audio/mpeg': '.mp3', 'audio/mp4': '.m4a', 'audio/ogg': '.ogg',
                      'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif',
                      'application/pdf': '.pdf', 'application/zip': '.zip',
                      'application/x-rar': '.rar', 'application/x-7z-compressed': '.7z'
                    };
                    const ext = extMap[fileType] || '';
                    const finalPath = outputPath + ext;
                    fs.renameSync(tempPath, finalPath);
                    downloadedFiles.push(finalPath);
                    console.log(`   ✅ Saved as: ${path.basename(finalPath)}`);
                  }
                } catch (err) {
                  console.error(`   ❌ Error downloading: ${err.message}`);
                }
              } else {
                try {
                  await downloadMediaFile(client, message.media, outputPath, fileName);
                  downloadedFiles.push(outputPath);
                } catch (err) {
                  console.error(`   ❌ Error downloading: ${err.message}`);
                }
              }
            } else {
              console.log(`⚠️ No media found in this post`);
            }
            
            const infoFile = path.join(postDir, 'post_info.json');
            const totalSizeMB = downloadedFiles.reduce((sum, f) => {
              try {
                return sum + fs.statSync(f).size;
              } catch {
                return sum;
              }
            }, 0) / 1024 / 1024;
            
            fs.writeFileSync(infoFile, JSON.stringify({
              url: postUrl,
              channel: channelName,
              channelId: chatId,
              postId: msgId,
              postDate: message.date,
              totalFiles: downloadedFiles.length,
              totalSizeMB: totalSizeMB.toFixed(2),
              hasMedia: !!message.media,
              hasText: !!(message.text && message.text.length > 0)
            }, null, 2));
            
            if (!downloadedFiles.includes(infoFile)) {
              downloadedFiles.push(infoFile);
            }
            
            console.log(`\n📊 Post Summary:`);
            console.log(`   - Total files: ${downloadedFiles.length}`);
            console.log(`   - Total size: ${totalSizeMB.toFixed(2)}MB`);
            
            return {
              channel: channelName,
              postId: msgId,
              postDir: postDir,
              files: downloadedFiles,
              size: totalSizeMB,
              url: postUrl
            };
          }

          async function main() {
            let client = null;
            const allDownloads = [];
            
            try {
              console.log('🚀 Connecting to Telegram...');
              console.log(`📌 Total posts to download: ${postUrls.length}`);
              console.log(`📌 Posts: ${postUrls.join(', ')}\n`);
              
              const session = new StringSession(stringSession);
              client = new TelegramClient(session, apiId, apiHash, {
                connectionRetries: 5,
                useWSS: true,
              });
              
              await client.start({
                phoneNumber: () => Promise.reject(new Error('Use STRING_SESSION')),
                phoneCode: () => Promise.reject(new Error('Use STRING_SESSION')),
                password: () => Promise.reject(new Error('Use STRING_SESSION')),
                onError: (err) => console.error('Connection error:', err),
              });
              
              console.log('✅ Connected successfully!\n');
              
              for (let i = 0; i < postUrls.length; i++) {
                const result = await downloadPost(client, postUrls[i], i, postUrls.length);
                allDownloads.push(result);
              }
              
              const downloadsInfo = {
                totalPosts: allDownloads.length,
                downloadDate: new Date().toISOString(),
                posts: allDownloads.map(d => ({
                  channel: d.channel,
                  postId: d.postId,
                  url: d.url,
                  postDir: d.postDir,
                  size: d.size
                }))
              };
              
              fs.writeFileSync('/tmp/downloads_info.json', JSON.stringify(downloadsInfo, null, 2));
              
              const allDirs = allDownloads.map(d => d.postDir);
              fs.writeFileSync('/tmp/all_post_dirs.txt', allDirs.join('\n'));
              
              for (const d of allDownloads) {
                const postInfoFile = `/tmp/post_${d.channel}_${d.postId}.txt`;
                fs.writeFileSync(postInfoFile, d.postDir);
              }
              
              console.log(`\n${'='.repeat(60)}`);
              console.log(`📊 MASTER SUMMARY`);
              console.log(`${'='.repeat(60)}`);
              console.log(`✅ Total posts downloaded: ${allDownloads.length}`);
              console.log(`📁 Total size: ${downloadsInfo.posts.reduce((sum, p) => sum + p.size, 0).toFixed(2)}MB`);
              
            } catch (error) {
              console.error('❌ Fatal error:', error);
              process.exit(1);
            } finally {
              if (client) {
                try {
                  console.log('\n👋 Disconnecting from Telegram...');
                  await client.disconnect();
                  console.log('✅ Disconnected successfully');
                } catch (err) {
                  console.log('⚠️ Disconnect warning:', err.message);
                }
              }
            }
          }
          
          process.on('unhandledRejection', (err) => {
            if (err.message && err.message.includes('TIMEOUT')) {
              console.log('⚠️ Ignoring timeout error (download completed successfully)');
              process.exit(0);
            } else {
              console.error('Unhandled rejection:', err);
              process.exit(1);
            }
          });
          
          main().catch(err => {
            console.error('Main error:', err);
            process.exit(1);
          });
          EOF

          node download_telegram.js
          
          DOWNLOAD_EXIT=$?
          if [ $DOWNLOAD_EXIT -eq 0 ] || ([ -f "/tmp/all_post_dirs.txt" ] && [ -s "/tmp/all_post_dirs.txt" ]); then
            echo "Download completed successfully"
            echo "POST_DIRS=$(cat /tmp/all_post_dirs.txt)" >> $GITHUB_OUTPUT
            exit 0
          else
            exit $DOWNLOAD_EXIT
          fi

      - name: Create split ZIP archives (45MB parts)
        run: |
          echo "📁 Creating split ZIP archives (45MB per part)..."
          
          POST_DIRS=""
          if [ -f "/tmp/all_post_dirs.txt" ]; then
            POST_DIRS=$(cat /tmp/all_post_dirs.txt)
            echo "Found directories in /tmp/all_post_dirs.txt"
          fi
          
          if [ -z "$POST_DIRS" ]; then
            POST_DIRS=$(find /tmp/telegram_downloads -mindepth 2 -maxdepth 2 -type d 2>/dev/null)
            echo "Found directories via find: $POST_DIRS"
          fi
          
          if [ -z "$POST_DIRS" ]; then
            echo "❌ No downloads found!"
            exit 1
          fi
          
          mkdir -p downloads
          
          echo "$POST_DIRS" | while read POST_DIR; do
            if [ -z "$POST_DIR" ] || [ ! -d "$POST_DIR" ]; then
              continue
            fi
            
            CHANNEL_NAME=$(basename $(dirname "$POST_DIR"))
            POST_ID=$(basename "$POST_DIR")
            FOLDER_NAME="${CHANNEL_NAME}_${POST_ID}"
            TARGET_DIR="downloads/${FOLDER_NAME}"
            
            mkdir -p "$TARGET_DIR"
            
            echo ""
            echo "📦 Creating split archive for: $CHANNEL_NAME/$POST_ID"
            echo "   Source: $POST_DIR"
            
            # Copy all files to temp directory
            TEMP_DIR="/tmp/split_${FOLDER_NAME}"
            mkdir -p "$TEMP_DIR"
            
            FILE_COUNT=0
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                ORIGINAL_NAME=$(basename "$FILE")
                SAFE_NAME=$(echo "$ORIGINAL_NAME" | sed 's/[<>:"|?*]/_/g')
                cp "$FILE" "$TEMP_DIR/$SAFE_NAME"
                echo "   ✅ Added: $SAFE_NAME"
                FILE_COUNT=$((FILE_COUNT + 1))
              fi
            done
            
            if [ $FILE_COUNT -eq 0 ]; then
              echo "   ⚠️ No files found in post directory!"
              continue
            fi
            
            # Create split zip (45MB = 45000000 bytes) or ~43MB for safety
            cd "$TEMP_DIR"
            
            echo "   📀 Creating split ZIP (45MB parts)..."
            zip -r -s 43m "${FOLDER_NAME}.zip" ./* > /dev/null 2>&1
            
            # Move all split parts to target directory
            mv ${FOLDER_NAME}.z* "$TARGET_DIR/" 2>/dev/null || mv *.z* "$TARGET_DIR/" 2>/dev/null
            
            cd - > /dev/null
            
            # Count parts
            PART_COUNT=$(ls -1 "$TARGET_DIR"/*.z* 2>/dev/null | wc -l)
            
            # Get total size of all parts
            TOTAL_SIZE=0
            for PART in "$TARGET_DIR"/*.z*; do
              if [ -f "$PART" ]; then
                SIZE=$(stat -c%s "$PART" 2>/dev/null || echo 0)
                TOTAL_SIZE=$((TOTAL_SIZE + SIZE))
              fi
            done
            TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
            
            # Create README for this post
            REPO_OWNER="${{ github.repository_owner }}"
            REPO_NAME="${{ github.event.repository.name }}"
            BRANCH="${GITHUB_REF_NAME}"
            
            cat > "$TARGET_DIR/README.md" << EOF
# 📥 Telegram Post ${POST_ID}

---

## 📊 Download Information

| Property | Value |
|----------|-------|
| **Channel** | \`${CHANNEL_NAME}\` |
| **Post ID** | \`${POST_ID}\` |
| **Total Parts** | ${PART_COUNT} |
| **Total Size** | ${TOTAL_SIZE_MB} MB |
| **Part Size** | ~45 MB each |
| **Status** | ✅ **Complete** |

---

## 🔗 How to Download & Extract

### Option 1: Download all parts using GitHub
1. Download all files ending with \`.z01\`, \`.z02\`, ..., \`.zip\`
2. Place them in the **same folder**
3. Extract using:
   - **Windows**: Right-click \`.zip\` → Extract Here
   - **Linux/Mac**: \`unzip ${FOLDER_NAME}.zip\`

### Option 2: Direct download links

| Part | File | Size |
|------|------|------|
EOF
            
            # List all parts with download links
            for PART in $(ls -1 "$TARGET_DIR"/*.z* 2>/dev/null | sort); do
              PART_NAME=$(basename "$PART")
              PART_SIZE=$(stat -c%s "$PART" 2>/dev/null | awk '{printf "%.2f MB", $1/1024/1024}')
              PART_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$PART_NAME'))")
              RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${FOLDER_NAME}/${PART_ENCODED}"
              echo "| \`${PART_NAME}\` | [Download](${RAW_LINK}) | ${PART_SIZE} |" >> "$TARGET_DIR/README.md"
            done
            
            cat >> "$TARGET_DIR/README.md" << EOF

---

## 📖 How to Extract (Detailed)

1. **Download all parts** (all \`.z01\`, \`.z02\`, ..., \`.zip\` files)
2. **Place all parts** in the same directory
3. **Extract** using any of these methods:

### Windows:
- Right-click on \`${FOLDER_NAME}.zip\`
- Select "Extract All..."

### Linux/Mac Terminal:
\`\`\`bash
unzip ${FOLDER_NAME}.zip
\`\`\`

### Using 7-Zip:
\`\`\`bash
7z x ${FOLDER_NAME}.zip
\`\`\`

---

*🛠️ Created by [avasam.ir](https://avasam.ir)*
EOF
            
            echo "   ✅ Created ${PART_COUNT} part(s) (total ${TOTAL_SIZE_MB}MB)"
            
            # Cleanup temp
            rm -rf "$TEMP_DIR"
          done
          
          echo ""
          echo "✅ All split archives created successfully!"
          
          # Debug: show structure
          echo ""
          echo "📁 Created structure in downloads/:"
          ls -la downloads/
          for DIR in downloads/*/; do
            echo "   Contents of $DIR:"
            ls -la "$DIR"
          done

      - name: Update README files with split archives info
        run: |
          echo "📝 Updating README files..."
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          # Generate downloads/README.md
          cat > downloads/README.md << 'EOF'
          # 📥 Downloads from Telegram
          
          This folder contains downloaded posts from Telegram channels.
          
          Each post is split into **45MB ZIP parts** for easy downloading.
          
          ---
          
          ## 📁 Available Downloads
          
          | # | Post | Parts | Size | Date |
          |---|------|-------|------|------|
          EOF
          
          COUNTER=1
          for FOLDER in $(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort); do
            if [ -n "$FOLDER" ] && [ "$FOLDER" != "downloads" ]; then
              FOLDER_ENCODED=$(urlencode "${FOLDER}")
              PARTS=$(ls -1 downloads/${FOLDER}/*.z* 2>/dev/null | wc -l)
              SIZE="Unknown"
              DATE=$(date '+%Y-%m-%d')
              
              if [ -f "downloads/$FOLDER/README.md" ]; then
                SIZE_LINE=$(grep "Total Size" "downloads/$FOLDER/README.md" | head -1)
                if [[ "$SIZE_LINE" =~ ([0-9.]+)\ MB ]]; then
                  SIZE="${BASH_REMATCH[1]} MB"
                fi
              fi
              
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} parts | ${SIZE} | ${DATE} |" >> downloads/README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          cat >> downloads/README.md << 'EOF'
          
          ---
          
          ## 📖 How to Download & Extract
          
          1. Click on any post folder above
          2. **Download ALL parts** (files ending with `.z01`, `.z02`, ..., `.zip`)
          3. Place all parts in the **same folder**
          4. Extract the `.zip` file using:
             - **Windows**: Right-click → Extract All
             - **Linux/Mac**: `unzip filename.zip`
             - **7-Zip**: `7z x filename.zip`
          
          ---
          
          *🛠️ Created by [avasam.ir](https://avasam.ir)*
          EOF
          
          echo "✅ downloads/README.md created/updated"
          
          # Update root README.md
          ROOT_README="README.md"
          SECTION_TITLE="📥 دانلود‌های تلگرام"
          
          if [ ! -f "$ROOT_README" ]; then
            echo "# AVASAM Telegram Downloader" > "$ROOT_README"
            echo "" >> "$ROOT_README"
            echo "دانلود خودکار فایل‌های تلگرام و آپلود در گیت‌هاب (تقسیم شده به زیپ‌های ۴۵ مگابایتی)" >> "$ROOT_README"
            echo "" >> "$ROOT_README"
          fi
          
          # Remove old section if exists
          if grep -q "$SECTION_TITLE" "$ROOT_README"; then
            sed -i "/$SECTION_TITLE/,/^---$/d" "$ROOT_README"
            sed -i '${/^$/d;}' "$ROOT_README"
          fi
          
          # Add new section
          {
            echo ""
            echo "---"
            echo ""
            echo "## $SECTION_TITLE"
            echo ""
            echo "| # | Post | Parts | Size | Date |"
            echo "|---|------|-------|------|------|"
          } >> "$ROOT_README"
          
          COUNTER=1
          for FOLDER in $(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort); do
            if [ -n "$FOLDER" ] && [ "$FOLDER" != "downloads" ]; then
              FOLDER_ENCODED=$(urlencode "${FOLDER}")
              PARTS=$(ls -1 downloads/${FOLDER}/*.z* 2>/dev/null | wc -l)
              SIZE="Unknown"
              DATE=$(date '+%Y-%m-%d')
              
              if [ -f "downloads/$FOLDER/README.md" ]; then
                SIZE_LINE=$(grep "Total Size" "downloads/$FOLDER/README.md" | head -1)
                if [[ "$SIZE_LINE" =~ ([0-9.]+)\ MB ]]; then
                  SIZE="${BASH_REMATCH[1]} MB"
                fi
              fi
              
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} parts | ${SIZE} | ${DATE} |" >> "$ROOT_README"
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          {
            echo ""
            echo "---"
            echo ""
            echo "> **Note:** Each post is split into 45MB parts. Download all parts and extract the main .zip file."
          } >> "$ROOT_README"
          
          echo "✅ Root README.md updated"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi
          
          git add -f downloads/
          git add README.md
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download multiple Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if timeout 300 git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retry $i/5..."
                if [ $i -lt 5 ]; then
                  sleep 10
                  git pull --rebase origin "$BRANCH" 2>/dev/null || true
                  git add -f downloads/
                  git add README.md
                  if ! git diff --cached --quiet; then
                    git commit -m "Download multiple Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
                  fi
                fi
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "📁 Files are stored directly in the repository"
          echo "📦 Each post is split into 45MB ZIP parts"
          echo "=========================================="
