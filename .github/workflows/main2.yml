name: ⬇️ Download Telegram Posts

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (هر لینک در یک خط)'
        required: true
        type: string
        placeholder: |
          https://t.me/username/123
          https://t.me/username/456

jobs:
  download-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    
    steps:
      - name: 🧹 Extreme disk space cleanup
        run: |
          echo "Freeing up massive disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/gecko_driver
          sudo docker system prune -a -f --volumes 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          rm -rf ~/.cache
          rm -rf ~/.npm
          rm -rf ~/.cargo
          rm -rf ~/.rustup
          
          echo ""
          echo "📊 Available disk space after cleanup:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available! Not enough space."
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available - good to continue!"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3 aria2

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Download posts from Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          # Create directory for downloads
          mkdir -p /tmp/telegram_downloads
          
          # Create download script
          cat > download_telegram.js << 'EOF'
          const { TelegramClient } = require("telegram");
          const { StringSession } = require("telegram/sessions");
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const apiId = parseInt(process.env.API_ID);
          const apiHash = process.env.API_HASH;
          const stringSession = process.env.STRING_SESSION;
          const postUrl = process.env.POST_URL;

          function sanitizeFilename(filename) {
            return filename.replace(/[<>:"|?*\\/]/g, '_').replace(/\s+/g, '_');
          }

          async function extractChatAndMsgId(url) {
            const patterns = [
              /https?:\/\/t\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
              /https?:\/\/telegram\.me\/(?:c\/)?([^\/]+)\/(\d+)/,
            ];
            
            let match = null;
            for (const pattern of patterns) {
              match = url.match(pattern);
              if (match) break;
            }
            
            if (!match) {
              throw new Error(`Invalid Telegram post URL format: ${url}`);
            }
            
            let chatId = match[1];
            const msgId = parseInt(match[2]);
            
            if (chatId === 'c' || chatId.startsWith('c/')) {
              chatId = '-100' + chatId.replace('c/', '').replace('c', '');
            } else if (!isNaN(parseInt(chatId)) && chatId.length > 5) {
              chatId = '-100' + chatId;
            }
            
            return { chatId, msgId };
          }

          async function downloadMediaFile(client, media, outputPath, fileName) {
            return new Promise(async (resolve, reject) => {
              try {
                let lastPercent = 0;
                const filePath = await client.downloadMedia(media, {
                  outputFile: outputPath,
                  progressCallback: (downloaded, total) => {
                    const percent = (downloaded / total * 100);
                    if (Math.floor(percent / 10) > Math.floor(lastPercent / 10) || percent === 100) {
                      lastPercent = percent;
                      console.log(`      📊 ${percent.toFixed(0)}% (${(downloaded/1024/1024).toFixed(1)}MB / ${(total/1024/1024).toFixed(1)}MB)`);
                    }
                  }
                });
                
                if (filePath && fs.existsSync(filePath) && fs.statSync(filePath).size > 0) {
                  console.log(`   ✅ Downloaded: ${fileName} (${(fs.statSync(filePath).size/1024/1024).toFixed(2)}MB)`);
                  resolve(filePath);
                } else {
                  reject(new Error("Download failed"));
                }
              } catch (err) {
                reject(err);
              }
            });
          }

          async function downloadPost(client, postUrl) {
            console.log(`\n${'='.repeat(50)}`);
            console.log(`📌 Processing: ${postUrl}`);
            console.log(`${'='.repeat(50)}`);
            
            const { chatId, msgId } = await extractChatAndMsgId(postUrl);
            
            let chat;
            if (chatId.toString().startsWith('-100')) {
              chat = await client.getEntity(parseInt(chatId));
            } else {
              chat = await client.getEntity(chatId);
            }
            
            let channelName = "unknown_channel";
            if (chat.username) {
              channelName = chat.username;
            } else if (chat.title) {
              channelName = sanitizeFilename(chat.title);
            } else {
              channelName = chatId.toString().replace('-100', '');
            }
            
            const messages = await client.getMessages(chat, { ids: msgId });
            const message = messages[0];
            
            if (!message) {
              throw new Error(`Message ${msgId} not found`);
            }
            
            console.log(`✅ Channel: ${channelName}`);
            console.log(`✅ Message ID: ${msgId}`);
            
            const postDir = `/tmp/telegram_downloads/${channelName}/${msgId}`;
            fs.mkdirSync(postDir, { recursive: true });
            
            const downloadedFiles = [];
            
            if (message.text && message.text.length > 0) {
              const textFile = path.join(postDir, 'message_text.txt');
              fs.writeFileSync(textFile, message.text);
              downloadedFiles.push(textFile);
              console.log(`📝 Saved text (${message.text.length} chars)`);
            }
            
            if (message.media) {
              console.log(`📥 Downloading media...`);
              
              let fileName = null;
              if (message.media.document && message.media.document.attributes) {
                for (const attr of message.media.document.attributes) {
                  if (attr.className === 'DocumentAttributeFilename') {
                    fileName = sanitizeFilename(attr.fileName);
                    break;
                  }
                }
              }
              
              if (!fileName) {
                const mediaType = message.media.className;
                if (mediaType === 'MessageMediaPhoto') {
                  fileName = `photo_${Date.now()}.jpg`;
                } else if (mediaType === 'MessageMediaDocument') {
                  fileName = `document_${Date.now()}`;
                } else {
                  fileName = `media_${Date.now()}`;
                }
              }
              
              const tempPath = path.join(postDir, 'temp_download');
              
              try {
                await downloadMediaFile(client, message.media, tempPath, fileName);
                
                if (fs.existsSync(tempPath) && fs.statSync(tempPath).size > 0) {
                  const fileType = execSync(`file --mime-type -b "${tempPath}"`).toString().trim();
                  const extMap = {
                    'video/mp4': '.mp4', 'video/x-matroska': '.mkv', 'video/webm': '.webm',
                    'video/quicktime': '.mov', 'video/x-msvideo': '.avi',
                    'audio/mpeg': '.mp3', 'audio/mp4': '.m4a', 'audio/ogg': '.ogg',
                    'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif',
                    'application/pdf': '.pdf', 'application/zip': '.zip',
                    'application/x-rar': '.rar'
                  };
                  const ext = extMap[fileType] || '';
                  
                  let finalFileName = fileName;
                  if (!fileName.includes('.') && ext) {
                    finalFileName = fileName + ext;
                  }
                  
                  const finalPath = path.join(postDir, finalFileName);
                  fs.renameSync(tempPath, finalPath);
                  downloadedFiles.push(finalPath);
                  console.log(`   ✅ Saved as: ${finalFileName}`);
                }
              } catch (err) {
                console.error(`   ❌ Download error: ${err.message}`);
              }
            }
            
            const totalSize = downloadedFiles.reduce((sum, f) => {
              try { return sum + fs.statSync(f).size; } catch { return sum; }
            }, 0);
            
            console.log(`📊 Summary: ${downloadedFiles.length} file(s), ${(totalSize/1024/1024).toFixed(2)}MB`);
            console.log(`📁 Saved to: ${postDir}`);
            
            return postDir;
          }

          async function main() {
            let client = null;
            
            try {
              console.log('🚀 Connecting to Telegram API...');
              
              const session = new StringSession(stringSession);
              client = new TelegramClient(session, apiId, apiHash, {
                connectionRetries: 3,
                useWSS: true,
              });
              
              await client.start({
                phoneNumber: () => { throw new Error('Use STRING_SESSION'); },
                phoneCode: () => { throw new Error('Use STRING_SESSION'); },
                password: () => { throw new Error('Use STRING_SESSION'); },
              });
              
              console.log('✅ Connected!\n');
              
              const postDir = await downloadPost(client, postUrl);
              fs.writeFileSync('/tmp/downloaded_post_dir.txt', postDir);
              
              console.log(`\n✅ Download completed!`);
              
            } catch (error) {
              console.error('❌ Error:', error.message);
              process.exit(1);
            } finally {
              if (client) await client.disconnect();
            }
          }
          
          main();
          EOF
          
          # Process each URL
          echo "${{ github.event.inputs.post_urls }}" | while IFS= read -r URL; do
            if [ -z "$URL" ]; then
              continue
            fi
            
            echo ""
            echo "=========================================="
            echo "📥 Downloading: $URL"
            echo "=========================================="
            
            export POST_URL="$URL"
            node download_telegram.js
            
            if [ $? -eq 0 ] && [ -f "/tmp/downloaded_post_dir.txt" ]; then
              cat /tmp/downloaded_post_dir.txt >> /tmp/all_post_dirs.txt
              echo "" >> /tmp/all_post_dirs.txt
              echo "✅ Download successful"
            else
              echo "❌ Download failed for: $URL"
            fi
            
            rm -f /tmp/downloaded_post_dir.txt
          done
          
          if [ ! -f "/tmp/all_post_dirs.txt" ] || [ ! -s "/tmp/all_post_dirs.txt" ]; then
            echo "❌ No posts were downloaded!"
            exit 1
          fi
          
          echo "✅ All downloads completed!"

      - name: Create split ZIP archives (45MB parts)
        run: |
          echo "📦 Creating split ZIP archives (45MB per part)..."
          
          SPLIT_THRESHOLD_MB=45
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          BACKUP_DIR="/tmp/download_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            echo "${NAME}_$(date +%s)_$RANDOM"
          }
          
          # Read directories
          while IFS= read -r POST_DIR; do
            if [ -z "$POST_DIR" ] || [ ! -d "$POST_DIR" ]; then
              continue
            fi
            
            CHANNEL_NAME=$(basename "$(dirname "$POST_DIR")")
            POST_ID=$(basename "$POST_DIR")
            FOLDER_NAME="${CHANNEL_NAME}_${POST_ID}"
            TARGET_DIR="$BACKUP_DIR/$FOLDER_NAME"
            
            mkdir -p "$TARGET_DIR"
            
            echo ""
            echo "📁 Processing: $CHANNEL_NAME / $POST_ID"
            
            # Copy files
            FILE_COUNT=0
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                ORIGINAL_NAME=$(basename "$FILE")
                SAFE_NAME=$(echo "$ORIGINAL_NAME" | sed 's/[<>:"|?*]/_/g')
                cp "$FILE" "$TARGET_DIR/$SAFE_NAME"
                echo "   ✅ Added: $SAFE_NAME"
                FILE_COUNT=$((FILE_COUNT + 1))
              fi
            done
            
            if [ $FILE_COUNT -eq 0 ]; then
              echo "   ⚠️ No files found!"
              continue
            fi
            
            # Create split zip
            cd "$TARGET_DIR"
            
            echo "   📀 Creating split ZIP (${SPLIT_THRESHOLD_MB}MB parts)..."
            zip -r -0 -s ${SPLIT_THRESHOLD_MB}m "${FOLDER_NAME}.zip" ./* > /dev/null 2>&1
            
            # Remove original files
            rm -f message_text.txt post_info.json 2>/dev/null || true
            
            cd - > /dev/null
            
            # Count parts
            PART_COUNT=$(ls -1 "$TARGET_DIR"/*.z* "$TARGET_DIR"/*.zip 2>/dev/null | wc -l)
            
            if [ $PART_COUNT -eq 0 ]; then
              echo "   ❌ Failed to create archive!"
              continue
            fi
            
            # Calculate total size
            TOTAL_SIZE=0
            for PART in "$TARGET_DIR"/*; do
              [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART" 2>/dev/null || echo 0)))
            done
            TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
            
            # Create README for this post
            FOLDER_ENCODED=$(urlencode "$FOLDER_NAME")
            
            cat > "$TARGET_DIR/README.md" << EOF
# 📥 ${FOLDER_NAME}

**Total Size:** ${TOTAL_SIZE_MB} MB  
**Parts:** ${PART_COUNT}  
**Status:** ✅ Complete

---

## 📦 Download Links

| Part | File | Link |
|------|------|------|
EOF
            
            for PART in $(ls -1 "$TARGET_DIR"/*.zip "$TARGET_DIR"/*.z[0-9]* 2>/dev/null | sort); do
              PART_NAME=$(basename "$PART")
              PART_ENCODED=$(urlencode "$PART_NAME")
              RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/downloads/${FOLDER_ENCODED}/${PART_ENCODED}"
              echo "| ${PART_NAME##*.} | \`${PART_NAME}\` | [Download](${RAW_LINK}) |" >> "$TARGET_DIR/README.md"
            done
            
            cat >> "$TARGET_DIR/README.md" << 'EOF'

---

## 📖 How to Extract

1. **Download ALL parts** to the same folder
2. **Extract** the `.zip` file

*Created by [avasam.ir](https://avasam.ir)*
EOF
            
            echo "   ✅ Created ${PART_COUNT} part(s) (${TOTAL_SIZE_MB}MB total)"
            
          done < /tmp/all_post_dirs.txt
          
          echo ""
          echo "✅ All split archives created!"

      - name: Update README.md with download links
        run: |
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          
          mkdir -p downloads
          if [ -d "$BACKUP_DIR" ] && [ "$(ls -A $BACKUP_DIR 2>/dev/null)" ]; then
            cp -r "$BACKUP_DIR"/* downloads/
          fi
          
          FOLDERS=$(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)
          
          if [ -z "$FOLDERS" ]; then
            echo "No folders found in downloads"
            exit 0
          fi
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          # Create downloads/README.md
          {
            echo "# 📥 Telegram Downloads"
            echo ""
            echo "| # | Post | Parts | Size |"
            echo "|---|------|-------|------|"
          } > downloads/README.md
          
          COUNTER=1
          for FOLDER in $FOLDERS; do
            if [ -n "$FOLDER" ]; then
              FOLDER_ENCODED=$(urlencode "$FOLDER")
              PARTS=$(ls -1 downloads/$FOLDER/*.zip downloads/$FOLDER/*.z[0-9]* 2>/dev/null | wc -l)
              SIZE=$(du -sh "downloads/$FOLDER" 2>/dev/null | cut -f1)
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} | ${SIZE} |" >> downloads/README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          cat >> downloads/README.md << 'EOF'
          
          ---
          
          ## 📖 How to Extract
          
          1. Click on any post folder above
          2. **Download ALL parts** (.z01, .z02, ..., .zip)
          3. Extract the `.zip` file
          
          *Created by [avasam.ir](https://avasam.ir)*
          EOF
          
          # Update root README
          SECTION_TITLE="📥 دانلود‌های تلگرام"
          
          if [ ! -f "README.md" ]; then
            echo "# AVASAM Telegram Downloader" > README.md
            echo "" >> README.md
            echo "دانلود خودکار پست‌های تلگرام" >> README.md
          fi
          
          if grep -q "$SECTION_TITLE" README.md; then
            sed -i "/$SECTION_TITLE/,/^---$/d" README.md
          fi
          
          {
            echo ""
            echo "---"
            echo ""
            echo "## $SECTION_TITLE"
            echo ""
            echo "| # | Post | Parts | Size |"
            echo "|---|------|-------|------|"
          } >> README.md
          
          COUNTER=1
          for FOLDER in $FOLDERS; do
            if [ -n "$FOLDER" ]; then
              FOLDER_ENCODED=$(urlencode "$FOLDER")
              PARTS=$(ls -1 downloads/$FOLDER/*.zip downloads/$FOLDER/*.z[0-9]* 2>/dev/null | wc -l)
              SIZE=$(du -sh "downloads/$FOLDER" 2>/dev/null | cut -f1)
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} | ${SIZE} |" >> README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          
          echo "✅ README files updated"

      - name: Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          
          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi
          
          git add -f downloads/
          git add README.md
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "=========================================="
