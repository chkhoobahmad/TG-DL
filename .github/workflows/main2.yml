name: ⬇️ Download Multiple Telegram Posts

on:
  workflow_dispatch:
    inputs:
      post_urls:
        description: '🔗 لینک‌های پست تلگرام (هر لینک در یک خط)'
        required: true
        type: string
        placeholder: |
          https://t.me/username/123
          https://t.me/username/456
          https://t.me/username/789

jobs:
  download-from-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    
    steps:
      - name: 🧹 Cleanup disk space
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/az /opt/microsoft /usr/lib/jvm /usr/local/go
          sudo docker system prune -a -f 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /tmp/*
          rm -rf ~/.cache ~/.npm ~/.cargo
          
          echo "📊 Available disk space:"
          df -h /
          
          AVAILABLE_GB=$(df --output=avail / | tail -n 1 | awk '{print int($1/1024/1024)}')
          if [ $AVAILABLE_GB -lt 5 ]; then
            echo "❌ Only ${AVAILABLE_GB}GB available!"
            exit 1
          fi
          echo "✅ ${AVAILABLE_GB}GB available"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install telegram@2.0.7
          sudo apt-get update
          sudo apt-get install -y zip curl bc file python3

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global http.postBuffer 524288000

      - name: Download posts from Telegram (Loop)
        id: download
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          # Create array of URLs
          mapfile -t POST_URLS <<< "${{ github.event.inputs.post_urls }}"
          
          mkdir -p /tmp/telegram_downloads
          
          COUNTER=1
          TOTAL=${#POST_URLS[@]}
          
          echo "📌 Total posts to download: ${TOTAL}"
          
          for URL in "${POST_URLS[@]}"; do
            # Skip empty lines
            if [ -z "$URL" ]; then
              continue
            fi
            
            echo ""
            echo "=========================================="
            echo "📥 Downloading post ${COUNTER}/${TOTAL}: ${URL}"
            echo "=========================================="
            
            export POST_URL="$URL"
            node download_telegram.js
            
            if [ $? -eq 0 ] && [ -f "/tmp/downloaded_post_dir.txt" ]; then
              cat /tmp/downloaded_post_dir.txt >> /tmp/all_post_dirs.txt
              echo "" >> /tmp/all_post_dirs.txt
              echo "✅ Post ${COUNTER} downloaded successfully"
            else
              echo "❌ Failed to download post ${COUNTER}"
            fi
            
            COUNTER=$((COUNTER + 1))
            rm -f /tmp/downloaded_post_dir.txt
          done
          
          if [ -f "/tmp/all_post_dirs.txt" ] && [ -s "/tmp/all_post_dirs.txt" ]; then
            echo "✅ All downloads completed!"
            cat /tmp/all_post_dirs.txt
          else
            echo "❌ No posts were downloaded!"
            exit 1
          fi

      - name: Create split ZIP archives (45MB parts)
        run: |
          echo "📦 Creating split ZIP archives (45MB per part)..."
          
          # Read directories into array
          POST_DIRS=()
          while IFS= read -r line; do
            [ -n "$line" ] && POST_DIRS+=("$line")
          done < /tmp/all_post_dirs.txt
          
          if [ ${#POST_DIRS[@]} -eq 0 ]; then
            echo "❌ No download directories found!"
            exit 1
          fi
          
          mkdir -p downloads
          SPLIT_SIZE="43m"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          for POST_DIR in "${POST_DIRS[@]}"; do
            if [ ! -d "$POST_DIR" ]; then
              echo "⚠️ Directory not found: $POST_DIR"
              continue
            fi
            
            CHANNEL_NAME=$(basename "$(dirname "$POST_DIR")")
            POST_ID=$(basename "$POST_DIR")
            FOLDER_NAME="${CHANNEL_NAME}_${POST_ID}"
            TARGET_DIR="downloads/${FOLDER_NAME}"
            
            mkdir -p "$TARGET_DIR"
            
            echo ""
            echo "📁 Processing: $CHANNEL_NAME / $POST_ID"
            
            # Copy files
            FILE_COUNT=0
            for FILE in "$POST_DIR"/*; do
              if [ -f "$FILE" ] && [ -s "$FILE" ]; then
                ORIGINAL_NAME=$(basename "$FILE")
                SAFE_NAME=$(echo "$ORIGINAL_NAME" | sed 's/[<>:"|?*]/_/g')
                cp "$FILE" "$TARGET_DIR/$SAFE_NAME"
                echo "   ✅ Added: $SAFE_NAME"
                FILE_COUNT=$((FILE_COUNT + 1))
              fi
            done
            
            if [ $FILE_COUNT -eq 0 ]; then
              echo "   ⚠️ No files found!"
              continue
            fi
            
            # Create split zip
            cd "$TARGET_DIR"
            
            echo "   📀 Creating split ZIP..."
            zip -r -s ${SPLIT_SIZE} "${FOLDER_NAME}.zip" ./* > /dev/null 2>&1
            
            # Remove original files, keep only zip parts
            rm -f message_text.txt post_info.json 2>/dev/null || true
            
            cd - > /dev/null
            
            # Count parts
            PART_COUNT=$(ls -1 "$TARGET_DIR"/*.z* "$TARGET_DIR"/*.zip 2>/dev/null | wc -l)
            
            if [ $PART_COUNT -eq 0 ]; then
              echo "   ❌ Failed to create archive!"
              continue
            fi
            
            # Calculate total size
            TOTAL_SIZE=0
            for PART in "$TARGET_DIR"/*; do
              [ -f "$PART" ] && TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART" 2>/dev/null || echo 0)))
            done
            TOTAL_SIZE_MB=$(echo "scale=2; $TOTAL_SIZE / 1024 / 1024" | bc)
            
            echo "   ✅ Created ${PART_COUNT} part(s) (${TOTAL_SIZE_MB}MB total)"
          done
          
          echo ""
          echo "✅ All split archives created!"

      - name: Generate README files
        run: |
          echo "📝 Generating README files..."
          
          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }
          
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          
          # Create downloads/README.md
          cat > downloads/README.md << 'EOF'
          # 📥 Telegram Downloads
          
          Posts downloaded from Telegram, split into **45MB ZIP parts**.
          
          ---
          
          ## 📁 Available Downloads
          
          | # | Post | Parts | Size |
          |---|------|-------|------|
          EOF
          
          COUNTER=1
          for FOLDER in $(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort); do
            if [ -n "$FOLDER" ]; then
              FOLDER_ENCODED=$(urlencode "$FOLDER")
              PARTS=$(ls -1 downloads/${FOLDER}/*.z* downloads/${FOLDER}/*.zip 2>/dev/null | wc -l)
              SIZE=$(du -sh "downloads/${FOLDER}" 2>/dev/null | cut -f1)
              
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} parts | ${SIZE} |" >> downloads/README.md
              COUNTER=$((COUNTER + 1))
              
              # Create README for each post
              cat > "downloads/${FOLDER}/README.md" << EOF
# 📥 ${FOLDER}

**Parts:** ${PARTS}  
**Size:** ${SIZE}  
**Status:** ✅ Complete

---

## 📦 Download Links

| Part | File | Link |
|------|------|------|
EOF
              
              for PART in $(ls -1 downloads/${FOLDER}/*.{zip,z[0-9]*} 2>/dev/null | sort); do
                PART_NAME=$(basename "$PART")
                PART_ENCODED=$(urlencode "$PART_NAME")
                RAW_LINK="https://github.com/${{ github.repository }}/raw/${GITHUB_REF_NAME}/downloads/${FOLDER}/${PART_ENCODED}"
                echo "| ${PART_NAME##*.} | \`${PART_NAME}\` | [Download](${RAW_LINK}) |" >> "downloads/${FOLDER}/README.md"
              done
              
              cat >> "downloads/${FOLDER}/README.md" << 'EOF'

---

## 📖 How to Extract

1. **Download ALL parts** to the same folder
2. **Extract** the `.zip` file

*Created by [avasam.ir](https://avasam.ir)*
EOF
            fi
          done
          
          cat >> downloads/README.md << 'EOF'
          
          ---
          
          ## 📖 How to Extract
          
          1. Click on any post folder above
          2. **Download ALL parts** (.z01, .z02, ..., .zip)
          3. Extract the `.zip` file
          
          *Created by [avasam.ir](https://avasam.ir)*
          EOF
          
          # Update root README
          cat > README.md << 'EOF'
          # AVASAM Telegram Downloader
          
          دانلود خودکار پست‌های تلگرام و ذخیره در گیت‌هاب
          
          ---
          
          ## 📥 دانلود‌های تلگرام
          
          EOF
          
          echo "| # | Post | Parts | Size |" >> README.md
          echo "|---|------|-------|------|" >> README.md
          
          COUNTER=1
          for FOLDER in $(find downloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort); do
            if [ -n "$FOLDER" ]; then
              FOLDER_ENCODED=$(urlencode "$FOLDER")
              PARTS=$(ls -1 downloads/${FOLDER}/*.z* downloads/${FOLDER}/*.zip 2>/dev/null | wc -l)
              SIZE=$(du -sh "downloads/${FOLDER}" 2>/dev/null | cut -f1)
              echo "| ${COUNTER} | [${FOLDER}](${REPO_URL}/${FOLDER_ENCODED}) | ${PARTS} | ${SIZE} |" >> README.md
              COUNTER=$((COUNTER + 1))
            fi
          done
          
          echo "" >> README.md
          echo "---" >> README.md
          echo "*Created by [avasam.ir](https://avasam.ir)*" >> README.md
          
          echo "✅ README files updated"

      - name: Commit and push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          if [ ! -d "downloads" ] || [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files to commit!"
            exit 1
          fi
          
          git add -f downloads/
          git add README.md
          git add download_telegram.js
          
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "Download Telegram posts (split 45MB) - $TIMESTAMP [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i/5..."
              if git push origin HEAD:"$BRANCH" 2>&1; then
                echo "✅ Push successful!"
                break
              else
                echo "Push failed, retrying..."
                sleep 10
                git pull --rebase origin "$BRANCH" 2>/dev/null || true
                git add -f downloads/
                git add README.md
              fi
            done
          else
            echo "No changes to commit"
          fi
          
          echo ""
          echo "=========================================="
          echo "✅ Process completed successfully!"
          echo "=========================================="
